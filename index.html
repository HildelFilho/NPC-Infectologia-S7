tico – Ceftriaxona."], ["b", "Tétano – Metronidazol."], ["c", "Chikungunya – Sintomáticos."], ["d", "Leptospirose – Ceftriaxona."]], "ans": "d", "cm": ["Nota de transcrição: \"seia dias\", \"frquente\" e \"pulmonaresões\" como no formulário. Há ainda um campo \"Outro:\" de resposta livre, não transcrito como alternativa.", "Exposição a água e ratos, mialgia com dor à palpação das panturrilhas, icterícia e comprometimento pulmonar (crepitações, SatO2 91%): leptospirose na forma ictérica (slide 29 da Aula 6 (Profa. Dionne; Supremo Slides p. 462)). Na fase tardia/grave, o tratamento é venoso: penicilina G cristalina, ampicilina, ceftriaxona ou cefotaxima, por no mínimo 7 dias (slide 51 da Aula 6 (Profa. Dionne; Supremo Slides p. 484)). Não há choque (PA 130x80), o que elimina a. Marcação: d; confere."]}, {"n": 13, "title": "Candidíase esofágica", "tag": "Fora do cronograma", "stem": "Qual a melhor opção de tratamento para candidíase esofágica?", "opts": [["a", "Fluconazol"], ["b", "Itraconazol"], ["c", "Cetoconazol"], ["d", "Voriconazol"]], "ans": "a", "cm": ["Fluconazol oral (ou venoso se não tolerar a via oral) por 14 a 21 dias é a primeira escolha da candidíase esofágica: boa absorção, boa atividade sobre C. albicans, poucos efeitos. Itraconazol e voriconazol são alternativas para refratários; cetoconazol caiu em desuso pela hepatotoxicidade. Antifúngicos não estão no cronograma da NPC 01. Marcação: fluconazol; confere."]}, {"n": 14, "title": "Sarampo", "tag": "Fora do cronograma", "stem": "MQT, sexo feminino, 3 anos, compareceu a UBS com história de febre alta acompanhada de tosse seca, coriza, conjuntivite e fotofobia. A mãe refere aparecimento de exantema máculo-papular que iniciou no rosto e se estendeu para troncos e membros no terceiro dia após inicio dos sintomas. Relata também a presença de pontos brancos na mucosa bucal. Relata calendário vacinal incompleto e que perdeu caderneta da criança. Qual a principal hipótese diagnóstica para a criança?", "opts": [["a", "Varicela."], ["b", "Escarlatina."], ["c", "Sarampo."], ["d", "Rubéola. SUPREMO INC.                                                                    Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Pródromo de febre alta com tosse, coriza e conjuntivite (os três \"C\"), manchas de Koplik e exantema maculopapular craniocaudal que começa no rosto por volta do 3º ao 5º dia, em criança com vacinação incompleta: sarampo. Varicela é vesicular, em surtos; escarlatina é micropapular áspera com palidez perioral; rubéola é mais leve, com adenomegalia retroauricular. Fora do cronograma da NPC 01. Marcação: sarampo; confere."]}, {"n": 15, "title": "Chikungunya · diagnóstico clínico", "tag": "NPC 01", "stem": "JTR, sexo feminino, 35 anos, é atendida na UPA febre alta de início súbito, cefaleia, mialgia, poliartralgia simétrica intensa em grandes e pequenas articulações, que dificultam a execução de suas atividades domésticas. Presença de rash eritematoso em tronco e membros superiores e inferiores, incluindo palma das mãos e planta dos pés. Ao exame físico: presença de edema nas articulações dos pés e das mãos.Qual é a principal hipótese para essa paciente?", "opts": [["a", "Dengue."], ["b", "Chikungunya."], ["c", "Sarampo."], ["d", "Zika."]], "ans": "b", "cm": ["Febre súbita com poliartralgia intensa (mais de 90%), poliartrite simétrica de mãos e pés, incapacitante com edema, e exantema: é o slide da forma aguda da chikungunya (slide 88 da Aula 4 (Profa. Dionne; Supremo Slides p. 317)). Na dengue a artralgia é leve; na zika predominam exantema pruriginoso e conjuntivite, com febre baixa (slide 117 da Aula 4 (Profa. Dionne; Supremo Slides p. 346)). Marcação: b; confere."]}, {"n": 16, "title": "Aspergilose invasiva", "tag": "Fora do cronograma", "stem": "Paciente com 37 anos, com diagnóstico de Linfoma, em tratamento quimioterápico e apresentando neutropenia prolongada. Qual melhor tratamento considerando a hipótese de aspergilose invasiva?", "opts": [["a", "Anfotericina B lipossomal."], ["b", "Caspofungina"], ["c", "Fluconazol"], ["d", "Voriconazol"]], "ans": "d", "cm": ["Voriconazol é a primeira linha da aspergilose invasiva (isavuconazol é alternativa equivalente); anfotericina lipossomal é alternativa; caspofungina fica para resgate; fluconazol não tem ação sobre Aspergillus. Mesma ideia da questão 20 da prova 2023.2. Fora do cronograma da NPC 01. Marcação: voriconazol; confere."]}, {"n": 17, "title": "Contato de tuberculose · investigação", "tag": "NPC 01", "stem": "Dona Marinela compareceu a Unidade Básica de Saúde com seu sobrinho Bernardo de 15 anos. Relata que o adolescente reside sozinho com o pai que teve exame de escarro positivo para tuberculose e iniciou tratamento há 30 dias. Não apresenta sintomas. Assinale a alternativa CORRETA em relação a conduta para Bernardo:", "opts": [["a", "Está indicada investigação de infecção latente por meio da prova tuberculínica (PPD)"], ["b", "Está indicada investigação de infecção latente por realização de radiografia de tórax"], ["c", "Está indicada investigação de infecção latente por realização de teste rápido molecular (GeneXpert)"], ["d", "Não há indicação de investigação uma vez que o adolescente se encontra assintomático."], ["e", "Opção 5"]], "ans": "a", "cm": ["Nota de transcrição: \"Opção 5\" é o texto-padrão de uma quinta alternativa deixada em branco no formulário; mantida como veio.", "Bernardo é contato domiciliar de caso pulmonar bacilífero: a avaliação de contatos é obrigatória mesmo sem sintomas (slide 108 da Aula 3 (Profa. Dionne; Supremo Slides p. 213)). Assintomático, investiga-se infecção latente com prova tuberculínica, indicada para \"identificar casos de ILTB em adultos e crianças\" (slide 84 da Aula 3 (Profa. Dionne; Supremo Slides p. 189)), ou IGRA (slide 113 da Aula 3 (Profa. Dionne; Supremo Slides p. 218)). A radiografia entra para afastar doença ativa quando a PT é positiva, não como teste de ILTB; o TRM detecta bacilo em amostra de doente, não infecção latente. Marcação: a (em dois prints); confere.", "SUPREMO INC.                                                                              Supremo Provas · NPC 01 · Infectologia"]}, {"n": 18, "title": "Estafilococo sensível à meticilina", "tag": "NPC 01", "stem": "Qual antimicrobiano é escolha para tratamento de infecção por estafilococo meticilino sensível?", "opts": [["a", "Oxacilina"], ["b", "Cefatazidima"], ["c", "Teicoplanina"], ["d", "Cefoxitina SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["Nota de transcrição: \"Cefatazidima\" como no formulário.", "No caso Severino, o S. aureus veio sensível à oxacilina e a vancomicina foi descontinuada por ser mais tóxica: o tratamento definitivo do MSSA é a oxacilina (slide 26 da Aula 1 (Prof. Érico; Supremo Slides p. 29)). Teicoplanina é glicopeptídeo, reservado a MRSA; ceftazidima tem ação fraca em Gram-positivos (foco em Gram-negativos e Pseudomonas, slide 44 da Aula 2 (Prof. Érico; Supremo Slides p. 88)); cefoxitina é 2ª geração com foco em anaeróbios (slide 43 da Aula 2 (Prof. Érico; Supremo Slides p. 87)). Marcação: oxacilina; confere."]}, {"n": 19, "title": "Meningite no lactente · terapia empírica", "tag": "SNC/HIV (práticas)", "stem": "KPL, 2 meses, apresenta-se com vômitos e febre, que não cede totalmente ao uso de dipirona, desde ontem à noite. Hoje amanheceu letárgica. Foi trazida ao pronto atendimento do Hospital São José apresentando irritabilidade e fontanela tensa ao exame físico. Qual a melhor opção terapêutica para este caso?", "opts": [["a", "Cefotaxima e Vancomicina."], ["b", "Ceftriaxona e Vancomicina."], ["c", "Cefotaxima e Ampicilina."], ["d", "Ceftriaxona e Ampicilina."]], "ans": "c", "cm": ["Meningite bacteriana em lactente de 2 meses: além de pneumococo, meningococo e Hib, é preciso cobrir os agentes do período neonatal tardio (estreptococo do grupo B, Listeria e enterobactérias). A Listeria só é coberta por ampicilina, o que elimina a e b. Entre c e d não há resposta única: a associação clássica abaixo de 2 a 3 meses é ampicilina + cefotaxima (preferida no neonato), mas aos 2 meses a ceftriaxona já é aceita e várias referências brasileiras listam \"cefotaxima ou ceftriaxona\". Questão ANULÁVEL; o gabarito em grade marca c, a forma clássica, e d deve ser aceita em recurso. Marcação no print: d. Tema das práticas (SNC)."]}, {"n": 20, "title": "Gram-negativo resistente a carbapenêmicos", "tag": "NPC 01", "stem": "Qual antimicrobiano está indicado para infecções nosocomiais por Gram negativos resistentes a carbapenêmicos?", "opts": [["a", "Linezolida"], ["b", "Teicoplanina"], ["c", "Polimixina B"], ["d", "Cefepime"]], "ans": "c", "cm": ["Polimixinas (polimixina B, colistina) mantêm atividade sobre muitos Gram-negativos resistentes a carbapenêmicos (Klebsiella KPC, Acinetobacter, Pseudomonas), por isso são usadas nesse cenário, em geral associadas (hoje há também ceftazidima-avibactam e outras opções). Linezolida e teicoplanina agem só em Gram-positivos; cefepima é hidrolisada pelas carbapenemases. Polimixinas não estão no deck do Prof. Érico. Marcação: polimixina B; confere.", "SUPREMO INC.                                                                          Supremo Provas · NPC 01 · Infectologia"]}]}, {"id": 4, "title": "Fixação extra                                ", "sub": "Questões autorais sobre temas pouco cobrados", "intro": "Fonte: Elaboração SUPREMO INC. a partir do Supremo Slides - NPC 01 - Infectologia (versão de 06/11/2026) Seção AUTORAL: não são questões de provas antigas. Cobrem os pontos dos slides que as provas de 2023.2, 2026.1 e do formulário quase não cobraram (farmacologia geral do ATB I, classes do ATB II, zika, tratamento da leptospirose, doses da LV, fase de erradicação da melioidose). Cada resposta sai literalmente de um slide, citado no comentário, no estilo das provas da casa (casos curtos, \"correta/INCORRETA\" e assertivas).", "qs": [{"n": 1, "title": "Farmacodinâmica · concentração-dependente", "tag": "NPC 01", "stem": "Segundo o perfil farmacodinâmico, qual antimicrobiano tem ação concentração-dependente?", "opts": [["a", "Penicilina cristalina"], ["b", "Cefalexina"], ["c", "Meropenem"], ["d", "Gentamicina"]], "ans": "d", "cm": ["O slide de farmacodinâmica divide: ação tempo-dependente (penicilinas, cefalosporinas, carbapenêmicos, vancomicina) e ação concentração-dependente (aminoglicosídeos, fluoroquinolonas, azitromicina, metronidazol) (slide 15 da Aula 1 (Prof. Érico; Supremo Slides p. 18)). Gentamicina é aminoglicosídeo; as demais são betalactâmicos, tempo-dependentes (o alvo é o tempo acima da MIC)."]}, {"n": 2, "title": "Bacteriostáticos x bactericidas", "tag": "NPC 01", "stem": "Sobre agentes bacteriostáticos, assinale a alternativa CORRETA:", "opts": [["a", "Reduzem o número total de microrganismos viáveis independentemente da resposta do hospedeiro."], ["b", "Impedem o crescimento e a replicação bacteriana, cabendo ao sistema imune do hospedeiro completar a eliminação do patógeno."], ["c", "São preferidos em pacientes neutropênicos, por dependerem pouco da imunidade."], ["d", "Têm curva de unidades formadoras de colônia que cai progressivamente até zero."]], "ans": "b", "cm": ["Slide \"Defesas do hospedeiro\": bacteriostáticos \"impedem o crescimento e replicação da bactéria; sistema imune do hospedeiro completa eliminação do patógeno\", e o destaque é IMUNOCOMPETÊNCIA (slide 16 da Aula 1 (Prof. Érico; Supremo Slides p. 19)). Por isso, no imunossuprimido, preferem-se bactericidas (c invertida). a e d descrevem bactericidas, cuja curva de UFC cai, enquanto a do bacteriostático fica em platô."]}, {"n": 3, "title": "Fatores do paciente na escolha do antibiótico", "tag": "NPC 01", "stem": "Na seleção do antibiótico, fatores relacionados ao paciente podem contraindicar algumas classes. Assinale a associação CORRETA entre situação, classe e efeito temido:", "opts": [["a", "Lactante; sulfonamidas; kernicterus."], ["b", "Gestante; aminoglicosídeos; alteração óssea no feto."], ["c", "Idoso; tetraciclinas; ototoxicidade."], ["d", "Alergia a penicilinas; macrolídeos; anafilaxia cruzada. SUPREMO INC.                                                                         Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["O slide traz os pares: idade, aminoglicosídeos e ototoxicidade em idosos; gravidez, tetraciclina e alteração óssea no feto; lactantes, sulfonamidas e kernicterus; alergias e penicilinas (slide 29 da Aula 1 (Prof. Érico; Supremo Slides p. 32)). b e c trocam as classes; macrolídeos não têm reação cruzada com penicilinas (d)."]}, {"n": 4, "title": "Profilaxia antimicrobiana", "tag": "NPC 01", "stem": "Sobre profilaxia antimicrobiana, assinale a alternativa INCORRETA:", "opts": [["a", "É usada em pessoas sem infecção, para protegê-las de bactérias às quais foram ou serão expostas."], ["b", "Pessoas expostas a meningite meningocócica podem receber rifampicina, ciprofloxacina ou ceftriaxona."], ["c", "A prevenção de pneumocistose em pessoas vivendo com HIV é feita com sulfametoxazol/trimetoprim quando o CD4 é maior que 500 células/mm³."], ["d", "A cefazolina é usada para prevenir infecção estafilocócica do sítio cirúrgico."]], "ans": "c", "cm": ["Todas saem do slide de profilaxia (slide 23 da Aula 1 (Prof. Érico; Supremo Slides p. 26)), mas a c troca o critério: a profilaxia de Pneumocystis jirovecii em PVHA é indicada com CD4 < 200 células/mm³. A cefazolina também é \"a escolha principal para profilaxia cirúrgica\" no slide de cefalosporinas (slide 43 da Aula 2 (Prof. Érico; Supremo Slides p. 87))."]}, {"n": 5, "title": "Teste rápido molecular · limites", "tag": "NPC 01", "stem": "Em relação ao teste rápido molecular para tuberculose (TRM-TB), assinale a alternativa CORRETA:", "opts": [["a", "É o exame indicado para o acompanhamento mensal do tratamento."], ["b", "Detecta DNA de bacilos vivos ou mortos e faz triagem de resistência à rifampicina."], ["c", "Em crianças menores de 10 anos tem sensibilidade superior à do adulto."], ["d", "No retratamento, dispensa cultura e teste de sensibilidade."]], "ans": "b", "cm": ["O TRM-TB é PCR em tempo real que detecta DNA do complexo M. tuberculosis e triagem de resistência à rifampicina, identificando material de microrganismos vivos ou mortos (slide 62 da Aula 3 (Profa. Dionne; Supremo Slides p. 167)). Justamente por detectar bacilo morto, não serve para acompanhar o tratamento, que é feito com baciloscopias mensais; no retratamento, exige baciloscopia, cultura e TS; em crianças < 10 anos a sensibilidade é baixa, 66% (slide 66 da Aula 3 (Profa. Dionne; Supremo Slides p. 171))."]}, {"n": 6, "title": "Macrolídeos", "tag": "NPC 01", "stem": "Sobre os macrolídeos, assinale a alternativa CORRETA:", "opts": [["a", "A claritromicina tem eliminação predominantemente biliar e grande interação com alimentos."], ["b", "A espiramicina tem baixa concentração placentária, por isso é evitada na gestação."], ["c", "A eritromicina reduz a motilidade do trato gastrointestinal."], ["d", "A azitromicina tem efeito pós-antibiótico que pode chegar a 5 dias e não inibe o citocromo P450."]], "ans": "d", "cm": ["Slide dos macrolídeos (slide 8 da Aula 2 (Prof. Érico; Supremo Slides p. 52)): eritromicina é estimulante da motilidade do TGI (daí a intolerância gastrointestinal), com ação anti-inflamatória e eliminação biliar; espiramicina tem pouca interação com alimentação e ALTA concentração placentária (por isso é usada na toxoplasmose da gestante); claritromicina tem pouca interação com alimentação e eliminação renal; azitromicina tem eliminação intestinal e biliar, efeito pós-antibiótico de até 5 dias e não inibe o P450.", "SUPREMO INC.                                                                              Supremo Provas · NPC 01 · Infectologia"]}, {"n": 7, "title": "Quinolonas · efeitos adversos", "tag": "NPC 01", "stem": "As quinolonas estão envolvidas em efeitos adversos potencialmente graves. Qual dos efeitos abaixo NÃO está entre os citados para a classe?", "opts": [["a", "Ototoxicidade com surdez irreversível"], ["b", "Rotura espontânea de grandes tendões"], ["c", "Formação ou rotura de aneurisma de aorta"], ["d", "Disglicemias"]], "ans": "a", "cm": ["Lista do slide: convulsões, psicose/depressão, descolamento de retina, arritmias cardíacas, formação/rotura de aneurisma de aorta, disglicemias, insuficiência renal, rotura espontânea de grandes tendões e artralgia/erosões articulares, com contraindicação em gestantes (slide 18 da Aula 2 (Prof. Érico; Supremo Slides p. 62)). Ototoxicidade é efeito clássico dos aminoglicosídeos (slide 29 da Aula 1 (Prof. Érico; Supremo Slides p. 32))."]}, {"n": 8, "title": "Quinolonas · vias e usos", "tag": "NPC 01", "stem": "Homem de 40 anos com pneumonia adquirida na comunidade, alérgico a betalactâmicos, receberá uma quinolona. Considerando os slides, assinale a alternativa CORRETA:", "opts": [["a", "Norfloxacino é boa opção, pois está disponível por via oral e endovenosa."], ["b", "Ciprofloxacino é a quinolona respiratória de escolha pela excelente ação contra pneumococo."], ["c", "Levofloxacino e moxifloxacino são as quinolonas respiratórias, com indicação em PAC, sinusite e OMA."], ["d", "Quinolonas são a classe preferida em gestantes com PAC. SUPREMO INC.                                                                     Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Levo e moxifloxacino são as \"quinolonas respiratórias\", com indicações que incluem ITU, gastroenterite, OMA, sinusite, PAC, pneumonia aspirativa e infecção intra-abdominal (slide 31 da Aula 2 (Prof. Érico; Supremo Slides p. 75)). Norfloxacino é só VO e de uso urinário/intestinal (slide 19 da Aula 2 (Prof. Érico; Supremo Slides p. 63)); ciprofloxacino tem atividade limitada em estreptococo e pneumococo nas tabelas do deck (slide 21 da Aula 2 (Prof. Érico; Supremo Slides p. 65)); quinolonas são contraindicadas em gestantes (slide 18 da Aula 2 (Prof. Érico; Supremo Slides p. 62))."]}, {"n": 9, "title": "Sulfas e trimetoprim", "tag": "NPC 01", "stem": "Analise as afirmativas sobre as sulfas:\nI. SMX-TMP é a única sulfa utilizada para infecções bacterianas.\nII. Sulfas têm atividade contra Pneumocystis, Paracoccidioides e Toxoplasma.\nIII. São seguras na gestação, pois repõem o ácido fólico fetal.\nIV. A mielotoxicidade (leucopenia, trombocitopenia e anemia) é efeito adverso das diaminopirimidinas. Estão corretas:", "opts": [["a", "I e III"], ["b", "I, II e IV"], ["c", "II e III"], ["d", "I, II, III e IV"]], "ans": "b", "cm": ["I e II estão no slide das sulfas, que também diz \"contraindicadas em gestantes: depleção de AF no feto = teratogênica\" (slide 37 da Aula 2 (Prof. Érico; Supremo Slides p. 81)), o que torna III falsa (o mecanismo é justamente bloquear a via do folato, slide 32 da Aula 2 (Prof. Érico; Supremo Slides p. 76)). IV: mielotoxicidade com leucopenia, trombocitopenia e anemia é o slide das diaminopirimidinas (trimetoprim) (slide 33 da Aula 2 (Prof. Érico; Supremo Slides p. 77))."]}, {"n": 10, "title": "Cefalosporinas · gerações", "tag": "NPC 01", "stem": "Qual geração de cefalosporinas é a única com cobertura eficaz contra MRSA?", "opts": [["a", "1ª geração (cefazolina, cefalexina)"], ["b", "3ª geração (ceftriaxona, ceftazidima)"], ["c", "4ª geração (cefepima)"], ["d", "5ª geração (ceftarolina, ceftobiprole)"]], "ans": "d", "cm": ["Nota clínica do slide: a 5ª geração é \"a única geração de cefalosporinas com cobertura eficaz contra MRSA\" (slide 44 da Aula 2 (Prof. Érico; Supremo Slides p. 88); linha do tempo em slide 42 da Aula 2 (Prof. Érico; Supremo Slides p. 86)). A 1ª tem foco Gram-positivo sensível; a 3ª, Gram-negativo (ceftazidima e cefoperazona cobrem Pseudomonas); a 4ª amplia para Gram-negativos resistentes e Pseudomonas, com boa penetração no SNC."]}, {"n": 11, "title": "Cefalosporinas · farmacocinética", "tag": "NPC 01", "stem": "Paciente com insuficiência renal precisa de uma cefalosporina de 3ª geração. Qual característica favorece a ceftriaxona nesse caso?", "opts": [["a", "Excreção biliar significativa e meia-vida longa, permitindo dose única diária."], ["b", "Ser a única cefalosporina que atravessa a barreira hematoencefálica."], ["c", "Cobertura de Pseudomonas aeruginosa, ausente nas demais de 3ª geração."], ["d", "Ação concentração-dependente, que dispensa ajuste de intervalo."]], "ans": "a", "cm": ["\"Exceções críticas: ceftriaxona e cefoperazona possuem excreção biliar significativa (ideal para nefropatas). A ceftriaxona possui meia-vida longa, permitindo dose única diária\" (slide 42 da Aula 2 (Prof. Érico; Supremo Slides p. 86)). b: 3ª e 4ª gerações atingem o LCR, não só a ceftriaxona. c: quem cobre Pseudomonas na 3ª geração são ceftazidima e cefoperazona (slide 44 da Aula 2 (Prof. Érico; Supremo Slides p. 88)). d: betalactâmicos são tempo-dependentes (slide 41 da Aula 2 (Prof. Érico; Supremo Slides p. 85))."]}, {"n": 12, "title": "Alergia cruzada penicilina-cefalosporina", "tag": "NPC 01", "stem": "Sobre a alergia cruzada entre penicilinas e cefalosporinas, assinale a alternativa CORRETA:", "opts": [["a", "A reatividade cruzada real é de 10 a 15%, o que contraindica qualquer cefalosporina em alérgicos à penicilina."], ["b", "Anafilaxia a cefalosporinas em alérgicos à penicilina ocorre em cerca de 1 a cada 50 pacientes."], ["c", "A reatividade cruzada global real é de cerca de 2% e depende da semelhança da cadeia lateral R1, como entre amoxicilina e cefalexina/cefadroxila."], ["d", "Como o anel betalactâmico é comum a todas, o risco é igual para qualquer cefalosporina. SUPREMO INC.                                                                   Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["\"O mito histórico\" de 10 a 15% contra \"a realidade clínica\": cerca de 2% de reatividade cruzada global, com anafilaxia estimada em 1 a cada 52.000 pessoas (slide 48 da Aula 2 (Prof. Érico; Supremo Slides p. 92)); o risco é governado pela cadeia lateral R1, não pelo anel, e cefalexina/cefadroxila têm R1 semelhante à da amoxicilina (slide 49 da Aula 2 (Prof. Érico; Supremo Slides p. 93); síntese em slide 50 da Aula 2 (Prof. Érico; Supremo Slides p. 94)).", "SUPREMO INC.                                                                                Supremo Provas · NPC 01 · Infectologia"]}, {"n": 13, "title": "Vancomicina · monitoramento", "tag": "NPC 01", "stem": "Sobre o monitoramento terapêutico da vancomicina, assinale a alternativa CORRETA:", "opts": [["a", "O alvo farmacocinético clássico contra MRSA é o tempo acima da MIC de 100% do intervalo."], ["b", "A relação AUC/MIC de 400 µg.h/mL é o alvo clássico contra MRSA, e a infusão contínua atinge o alvo com menor nefrotoxicidade."], ["c", "A teicoplanina exige AUC/MIC menor que a vancomicina para a mesma eficácia."], ["d", "Doses mais altas para atingir AUC/MIC elevadas não aumentam a nefrotoxicidade."]], "ans": "b", "cm": ["Alvo AUC/MIC: vancomicina contra MRSA, relação clássica de 400 µg.h/mL; teicoplanina exige AUC/MIC ≥ 900 (slide 57 da Aula 2 (Prof. Érico; Supremo Slides p. 101)). O dilema é eficácia contra segurança, pois doses sistêmicas elevadas se correlacionam com nefrotoxicidade grave; a solução apresentada é a infusão contínua (slide 58 da Aula 2 (Prof. Érico; Supremo Slides p. 102))."]}, {"n": 14, "title": "Zika · clínica", "tag": "NPC 01", "stem": "Sobre a infecção pelo vírus Zika, assinale a alternativa CORRETA:", "opts": [["a", "Cerca de 75% das infecções são assintomáticas, e entre as manifestações neurológicas estão microcefalia congênita e síndrome de Guillain-Barré."], ["b", "A maioria das infecções é sintomática, com artrite incapacitante que persiste por meses."], ["c", "É doença com letalidade elevada no adulto, por choque hemorrágico."], ["d", "O quadro sintomático dura habitualmente 3 a 4 semanas."]], "ans": "a", "cm": ["Slide da Zika: infecção assintomática em 75%, sintomática em 25%; febre, rash, mialgia, artralgia, cefaleia e conjuntivite por 2 a 7 dias; autolimitada, com óbito extremamente raro; manifestações neurológicas: microcefalia congênita, calcificações cerebrais, meningoencefalite e Guillain-Barré (slide 117 da Aula 4 (Profa. Dionne; Supremo Slides p. 346)). Artrite crônica incapacitante é a marca da chikungunya."]}, {"n": 15, "title": "Zika · microcefalia", "tag": "NPC 01", "stem": "Gestante pergunta qual o risco de microcefalia se tiver Zika no primeiro trimestre. Segundo os dados apresentados em aula, o risco é de aproximadamente:", "opts": [["a", "38 a 100%, semelhante ao da rubéola congênita."], ["b", "13%, semelhante ao do CMV."], ["c", "66 a 73%."], ["d", "1%, baixo por gestação, mas relevante pela altíssima incidência durante surtos."]], "ans": "d", "cm": ["O slide compara: risco de 1% para infecção no 1º trimestre, baixo diante de CMV (13% de malformações) e rubéola (38 a 100% de SRC); contudo, a incidência de zika na população durante surto foi de 66 a 73%, muito acima das outras infecções na gravidez (slide 118 da Aula 4 (Profa. Dionne; Supremo Slides p. 347)). A alternativa c usa o número da incidência no surto, não o risco fetal."]}, {"n": 16, "title": "Chikungunya · diagnóstico laboratorial", "tag": "NPC 01", "stem": "Paciente no 2º dia de febre e poliartralgia com suspeita de chikungunya. Qual exame é adequado para confirmação neste momento?", "opts": [["a", "Sorologia IgM por ELISA"], ["b", "Sorologia IgG por ELISA"], ["c", "RT-PCR"], ["d", "Prova do laço"]], "ans": "c", "cm": ["Slide de diagnóstico da chikungunya: sorologia IgM e IgG por ELISA a partir do 6º dia; RT-PCR com viremia maior entre o 1º e o 5º dia; isolamento viral até o 3º dia (slide 106 da Aula 4 (Profa. Dionne; Supremo Slides p. 335)). No 2º dia, RT-PCR (o isolamento também seria possível, mas não está entre as opções). Prova do laço avalia fragilidade capilar na dengue e não confirma diagnóstico."]}, {"n": 17, "title": "Leptospirose · fase precoce", "tag": "NPC 01", "stem": "Criança de 7 anos com suspeita de leptospirose na fase precoce, sem sinais de gravidade, tratada ambulatorialmente. Qual a conduta antimicrobiana CORRETA?", "opts": [["a", "Doxiciclina 100 mg VO 12/12 h por 5 a 7 dias."], ["b", "Amoxicilina 50 mg/kg/dia VO, dividida de 8/8 h, por 5 a 7 dias."], ["c", "Penicilina G cristalina IV por no mínimo 7 dias."], ["d", "Não há indicação de antibiótico na fase precoce. SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]], "ans": "b", "cm": ["Fase precoce, criança: amoxicilina 50 mg/kg/dia VO de 8/8 h por 5 a 7 dias. A doxiciclina não deve ser usada em menores de 9 anos, grávidas e portadores de nefropatia ou hepatopatia (slide 50 da Aula 6 (Profa. Dionne; Supremo Slides p. 483)). Penicilina cristalina IV é para a fase tardia/forma grave (slide 51 da Aula 6 (Profa. Dionne; Supremo Slides p. 484)). O antibiótico é indicado em ambas as fases."]}, {"n": 18, "title": "Leptospirose · insuficiência renal", "tag": "NPC 01", "stem": "Sobre a insuficiência renal aguda da leptospirose, assinale a alternativa CORRETA:", "opts": [["a", "A forma não oligúrica é a mais frequente, e o potássio plasmático costuma estar normal ou diminuído."], ["b", "A forma oligúrica é a mais frequente e tem melhor prognóstico."], ["c", "A hipercalemia é o distúrbio eletrolítico típico."], ["d", "É complicação rara, presente em minoria dos casos ictéricos."]], "ans": "a", "cm": ["IRA na forma ictérica: presente na maioria dos pacientes; forma não oligúrica mais frequente; forma oligúrica com pior prognóstico; potássio plasmático normal ou diminuído, raramente elevado (slide 31 da Aula 6 (Profa. Dionne; Supremo Slides p. 464)). A hipocalemia (nefropatia perdedora de potássio) é marca da leptospirose, ao contrário das outras IRAs."]}, {"n": 19, "title": "Leishmaniose visceral · doses", "tag": "NPC 01", "stem": "Sobre o tratamento da leishmaniose visceral pelo Ministério da Saúde, assinale a alternativa CORRETA:", "opts": [["a", "Antimoniato de N-metil glucamina 5 mg/kg/dia por 7 dias, sem limite de ampolas."], ["b", "Anfotericina B lipossomal 20 mg/kg/dia por 20 a 40 dias."], ["c", "Antimoniato por via oral, em dose única diária."], ["d", "Antimoniato 20 mg/kg/dia por 20 a 40 dias, com limite máximo de três ampolas; anfotericina B lipossomal 3 mg/kg/dia por 7 dias ou 4 mg/kg/dia por 5 dias."]], "ans": "d", "cm": ["Antimoniato: ampolas de 5 mL com 1.500 mg (405 mg de antimônio pentavalente), 20 mg/kg/dia por 20 a 40 dias, limite de três ampolas (slide 64 da Aula 5 (Profa. Dionne; Supremo Slides p. 416)), por via endovenosa ou intramuscular (slide 65 da Aula 5 (Profa. Dionne; Supremo Slides p. 417)). Anfotericina B lipossomal: 3 mg/kg/dia por 7 dias ou 4 mg/kg/dia por 5 dias (slide 68 da Aula 5 (Profa. Dionne; Supremo Slides p. 420)). A b mistura a dose do antimoniato com a anfotericina.", "SUPREMO INC.                                                                       Supremo Provas · NPC 01 · Infectologia"]}, {"n": 20, "title": "Melioidose · fase de erradicação", "tag": "NPC 01", "stem": "Após a fase intensiva endovenosa do tratamento da melioidose, a fase oral de erradicação consiste em:", "opts": [["a", "Ciprofloxacino por 2 semanas."], ["b", "Doxiciclina por 4 semanas."], ["c", "Sulfametoxazol + trimetoprima por no mínimo 12 semanas, com amoxicilina-clavulanato como alternativa."], ["d", "Não há fase oral: a fase intensiva é suficiente."]], "ans": "c", "cm": ["Fase oral de erradicação: duração mínima de 12 semanas; primeira escolha SMX-TMP; alternativa amoxicilina + ácido clavulânico; na terapia prolongada com trimetoprima, ácido folínico (slides 53 e 55 da Aula 7 (Profa. Dionne; Supremo Slides p. 540 e 542)). A fase intensiva vem antes, com ceftazidima ou meropenem por no mínimo 3 a 4 semanas conforme a extensão (slides 51 e 54 da Aula 7 (Profa. Dionne; Supremo Slides p. 538 e 541))."]}]}];
D.forEach(s=>{s.title=s.title.replace(/\s+/g,' ').trim();s.sub=s.sub.replace(/\s+/g,' ').trim()});
const KEY='npc01-infecto-v1';
let S={sec:1,only:false,q:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const st=(s,q)=>S.q[s.id+'-'+q.n]||(S.q[s.id+'-'+q.n]={t:[],d:[],ok:0,rev:0});
const cur=()=>D.find(x=>x.id===S.sec)||D[0];
const vis=s=>s.qs.filter(q=>!S.only||q.tag==='NPC 01');

function head(){
  const s=cur();
  $('#tabs').replaceChildren(...D.map(x=>{const b=el('button','tab'+(x.id===s.id?' on':''),x.title);b.onclick=()=>{S.sec=x.id;save();render();scrollTo(0,0)};return b}));
  const v=vis(s);
  $('#chips').replaceChildren(...v.map(q=>{const a=st(s,q);const b=el('button','chip'+(a.ok&&!a.rev?(a.t.length?' bad':' ok'):a.rev||a.t.length?' bad':''),q.n);b.onclick=()=>{const t=document.getElementById('q'+q.n);t&&t.scrollIntoView({behavior:'smooth'})};return b}));
  const first=v.filter(q=>{const a=st(s,q);return a.ok&&!a.rev&&!a.t.length}).length;
  const dn=v.filter(q=>{const a=st(s,q);return a.ok||a.rev}).length;
  $('#stat').textContent=first+' certas de 1ª · '+dn+'/'+v.length+' resolvidas';
}

function opt(s,q,a,l,t,c){
  const done=a.ok||a.rev,dis=a.d.includes(l),wr=a.t.includes(l);
  const w=el('div','ow'),o=el('div','opt');
  w.dataset.hint=dis?'↺ restaurar':'✕ descartar';
  o.append(el('b','let',l.toUpperCase()),el('span','tx',t));
  if(done&&l===q.ans)o.classList.add('good');else if(wr)o.classList.add('bad');else if(dis)o.classList.add('dis');
  w.append(o);
  if(done||wr)return w;
  let x0=0,y0=0,dx=0,mv=false,id=null;
  const upd=()=>{save();head();c.replaceWith(card(s,q))};
  o.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;mv=false;id=e.pointerId});
  o.addEventListener('pointermove',e=>{
    if(id!==e.pointerId)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(!mv&&Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)){mv=true;try{o.setPointerCapture(id)}catch(_){}o.classList.add('drag')}
    if(mv){dx=mx;o.style.transform='translateX('+dx+'px)'}
  });
  const end=e=>{
    if(id!==e.pointerId)return;id=null;
    o.classList.remove('drag');o.style.transform='';
    if(mv){
      if(Math.abs(dx)>70){a.d=dis?a.d.filter(x=>x!==l):a.d.concat(l);upd()}
    }else if(e.type==='pointerup'){
      if(dis)a.d=a.d.filter(x=>x!==l);
      else if(l===q.ans)a.ok=1;
      else{a.t.push(l);navigator.vibrate&&navigator.vibrate(15)}
      upd();
    }
  };
  o.addEventListener('pointerup',end);o.addEventListener('pointercancel',end);
  return w;
}

function card(s,q){
  const a=st(s,q),done=a.ok||a.rev;
  const c=el('article','card');c.id='q'+q.n;
  const hd=el('div','hd');
  hd.append(el('span','num',q.n),el('span','ttl',q.title),el('span','tag'+(q.tag==='NPC 01'?' in':''),q.tag));
  c.append(hd,el('p','stem',q.stem));
  q.opts.forEach(([l,t])=>c.append(opt(s,q,a,l,t,c)));
  const act=el('div','act');
  const upd=()=>{save();head();c.replaceWith(card(s,q))};
  if(!done){const b=el('button','sm','Ver gabarito');b.onclick=()=>{a.rev=1;upd()};act.append(b)}
  else{const b=el('button','sm','Refazer');b.onclick=()=>{delete S.q[s.id+'-'+q.n];upd()};act.append(b)}
  c.append(act);
  if(done){
    const cm=el('div','cm');
    cm.append(el('p','res','Resposta: '+q.ans.toUpperCase()));
    q.cm.forEach(p=>cm.append(el('p',p.startsWith('Nota de transcrição')?'nt':'',p)));
    c.append(cm);
  }
  return c;
}

function render(){
  const s=cur();
  $('#only').checked=S.only;
  head();
  const list=$('#list');
  list.replaceChildren();
  if(s.intro){const d=el('details','intro');d.append(el('summary','',s.sub+' · sobre esta seção'),el('p','',s.intro));list.append(d)}
  vis(s).forEach(q=>list.append(card(s,q)));
}
$('#only').onchange=e=>{S.only=e.target.checked;save();render()};
$('#reset').onclick=()=>{if(confirm('Zerar todo o progresso de todas as seções?')){S.q={};save();render()}};
render();
</script>
</body>
