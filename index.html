<script>
const D=[{"id": 1, "title": "Prova 2026.1 · 1ª chamada", "sub": "1ª chamada da prova de Infectologia, 2026.1", "intro": "Fonte: Provas antigas/Prova 2026.1 - 1ª chamada (fotos).pdf (6 fotos do caderno de prova, sem marcações) Transcrição integral das 25 questões a partir das fotos. Sem grade nem marcação do aluno nas fotos: todo o gabarito foi determinado de forma independente, pelo slide do professor, com as divergências em relação a diretrizes registradas nos comentários. Questões de HIV e de meningites não tuberculosas levam a etiqueta \"SNC/HIV (práticas)\": segundo a Profa. Dionne, esses temas ficam nas práticas.", "qs": [{"n": 1, "title": "Concentração inibitória mínima", "tag": "NPC 01", "stem": "Em relação à concentração inibitória mínima (CIM ou MIC Minimum Inhibitory Concentration), assinale a alternativa CORRETA:", "opts": [["a", "Corresponde à menor concentração do antimicrobiano capaz de matar 99,9% das bactérias presentes no inóculo."], ["b", "Representa a concentração sérica máxima alcançada após a administração do antimicrobiano."], ["c", "É a menor concentração do antimicrobiano capaz de impedir o crescimento visível do microrganismo em condições padronizadas de laboratório."], ["d", "Define o tempo necessário para que o antimicrobiano reduza pela metade a população bacteriana."], ["e", "Corresponde à concentração plasmática abaixo da qual ocorre toxicidade medicamentosa."]], "ans": "c", "cm": ["Nota de transcrição: No original, \"(CIM ou MIC – Minimum Inhibitory Concentration)\", com travessão. O slide de farmacodinâmica define a MIC como a \"menor concentração de ATB capaz de inibir o desenvolvimento visível do microrganismo\" (slide 15 da Aula 1 (Prof. Érico; Supremo Slides p. 18)). A alternativa a descreve a concentração bactericida mínima (CBM), que mata 99,9% do inóculo. A b é a Cmax, que no mesmo slide aparece em relação à MIC (Cmax/MIC). A d confunde com meia-vida, conceito farmacocinético e não de atividade antimicrobiana. A e não corresponde a nenhum parâmetro: toxicidade se relaciona a concentrações altas, não baixas."]}, {"n": 2, "title": "Quimioprofilaxia de contatos de meningite", "tag": "NPC 01", "stem": "Marina e Mariana encontram-se internadas no Hospital Infantil Albert Sabin com diagnóstico de meningite. Marina confirmou meningite meningocócica e Mariana meningite pneumocócica. Qual a conduta de imediato em relação aos contactantes íntimos de Marina e Mariana?", "opts": [["a", "Uso de rifampicina para contactantes de Marina e Mariana."], ["b", "Uso de rifampicina somente para contactantes de Marina."], ["c", "Uso de rifampicina somente para contactantes de Mariana."], ["d", "Uso de vacina meningocócica C conjugada para crianças contactantes de Marina."]], "ans": "b", "cm": ["Profilaxia é dada a pessoas sem infecção expostas a um agente; o slide cita exatamente \"pessoas expostas a meningite meningocócica: rifampicina, ciprofloxacina ou ceftriaxona\" (slide 23 da Aula 1 (Prof. Érico; Supremo Slides p. 26)). A meningite pneumocócica não é transmitida a contatos de forma que justifique quimioprofilaxia, por isso a e c estão erradas. A d não é a conduta imediata: a vacina pode ser indicada em bloqueio de surto pela vigilância, mas não substitui a quimioprofilaxia dos contatos íntimos. Embora meningites sejam tema das práticas, esta questão cai em princípios de antimicrobianos (profilaxia), por isso ficou no escopo."]}, {"n": 3, "title": "HIV · pneumocistose", "tag": "SNC/HIV (práticas)", "stem": "Um homem de 35 anos, vivendo com HIV, sem uso de terapia antirretroviral, procura atendimento por febre, dispneia progressiva há três semanas e tosse seca. Ao exame, apresenta saturação de O de 88% em ar 2 ambiente. A radiografia de tórax mostra infiltrado intersticial bilateral difuso. O CD4 é de 75 células/mm³. Qual é o diagnóstico mais provável?", "opts": [["a", "Pneumonia pneumocócica"], ["b", "Tuberculose pulmonar cavitaria"], ["c", "Aspergilose pulmonar invasiva"], ["d", "Pneumonia por Pneumocystis jirovecii"], ["e", "Pneumonia por Legionella pneumophila SUPREMO INC.                                                                   Supremo Provas · NPC 01 · Infectologia"]], "ans": "d", "cm": ["Nota de transcrição: \"cavitaria\" sem acento no original.", "Quadro subagudo (três semanas) de tosse seca, dispneia progressiva e hipoxemia desproporcional, com infiltrado intersticial bilateral difuso, em pessoa com HIV sem TARV e CD4 abaixo de 200 células/mm³: é a apresentação clássica da pneumocistose. A pneumonia pneumocócica é aguda, com consolidação lobar; a tuberculose cavitária dá cavitação, mais típica com CD4 mais preservado; a aspergilose invasiva é típica de neutropenia prolongada; Legionella é pneumonia aguda grave, sem relação com o CD4. O deck da Aula 1 cita SMX-TMP como profilaxia de Pneumocystis em PVHA com CD4 < 200 (slide 23 da Aula 1 (Prof. Érico; Supremo Slides p. 26))."]}, {"n": 4, "title": "Leishmaniose visceral · tratamento", "tag": "NPC 01", "stem": "Camila, 9 anos, procedente de Pacatuba, atendida na UPA. Segundo a mãe, a criança apresenta febre diária não medida há cerca de 45 dias. Evoluiu com anorexia, palidez cutâneo-mucosa e aumento do volume abdominal. Notou que a criança ficou mais prostrada há duas semanas. Exame físico: estado geral regular, hipocorada +++/4+, febril, anictérica, acianótica. Tórax: sem alterações. Abdome: flácido, aumentado de volume, com baço palpável a 8 cm do RCE e fígado palpável a 3 cm do RCD. Linfonodos: linfoadenopatia cervical bilateral, cerca de 0,5 cm. Sem outras alterações. Qual é a droga mais adequada para o tratamento considerando a principal hipótese diagnóstica para esse caso?", "opts": [["a", "Anfotericina B desoxicolato."], ["b", "Anfotericina B lipossomal."], ["c", "Antimoniato pentavalente."], ["d", "Alopurinol."]], "ans": "c", "cm": ["Febre prolongada, palidez, emagrecimento e hepatoesplenomegalia volumosa em criança do interior do Ceará: leishmaniose visceral. No deck, o tratamento é antimoniato de N-metil glucamina (slides 63 e 64 da Aula 5 (Profa. Dionne; Supremo Slides p. 415 e 416)) e a anfotericina B lipossomal fica para critérios específicos (slides 70 e 71 da Aula 5 (Profa. Dionne; Supremo Slides p. 422 e 423)): idade < 1 ano ou > 50 anos, insuficiência renal, hepática ou cardíaca, transplante, QTc > 450 ms, HIV, imunossupressão, falha ao antimoniato, gestação e escores de gravidade elevados. Camila (9 anos, sem icterícia, sangramento, edema ou infecção associada) não preenche nenhum, então a escolha é o antimoniato pentavalente. A desoxicolato é mais tóxica e não é primeira linha; alopurinol não é tratamento da LV humana. Pela Conitec (relatório nº 711, junho de 2026), as formulações lipídicas de anfotericina B foram incorporadas ao SUS, mas o próprio relatório mantém o antimoniato como primeira escolha na maioria dos casos; vale o slide.", "SUPREMO INC.                                                                               Supremo Provas · NPC 01 · Infectologia"]}, {"n": 5, "title": "Dengue · estadiamento e conduta", "tag": "NPC 01", "stem": "Mara, 40 anos, manicure, relata que há 4 dias iniciou quadro de febre alta, cefaleia e mialgia. Buscou atendimento na UPA no segundo dia e foi orientada a fazer hidratação por via oral. Desde ontem vem apresentando prostração, apesar da melhora da febre. Hoje passou a referir dor abdominal de forte intensidade associada a vômitos frequentes, retornando à UPA. Ao exame físico encontra-se eupnéica, anictérica, com perfusão capilar adequada. T: 37,5ºC, PA: 140x80 mmHg (sentaao), 110X70 mmHg (em pé). ACP: sem alterações. Abdome: doloroso a palpação difusamente, fígado há 2 cm do RCD. Extremidades: sem alterações. Prova do laço: negativa.\nAssinale a alternativa CORRETA:", "opts": [["a", "O estadiamento no primeiro atendimento é A com indicação de hidratação oral."], ["b", "O estadiamento no primeiro atendimento é B e a hidratação deveria ser na UPA."], ["c", "O estadiamento no segundo atendimento é C e a paciente deve ser internada na UTI."], ["d", "O estadiamento no segundo atendimento é D e a paciente deve ser internada na UTI."]], "ans": "a", "cm": ["Nota de transcrição: \"sentaao\" e \"há 2 cm\" como no original.", "No primeiro atendimento (2º dia) Mara tinha febre, cefaleia e mialgia, sem sinais de alarme, sem sangramento e sem fator de risco (40 anos, sem comorbidades): grupo A, acompanhamento ambulatorial com hidratação oral (slides 53 e 56 da Aula 4 (Profa. Dionne; Supremo Slides p. 282 e 285)). Logo, a está correta e b, errada. No segundo atendimento, na defervescência, surgem dor abdominal intensa, vômitos persistentes e queda postural da PA de 30 mmHg: sinais de alarme (slide 30 da Aula 4 (Profa. Dionne; Supremo Slides p. 259)), o que a coloca no grupo C. Mas o grupo C é internação em leito hospitalar (emergência ou enfermaria) por pelo menos 48 h com hidratação venosa (slide 63 da Aula 4 (Profa. Dionne; Supremo Slides p. 292)), não UTI; a c erra a conduta. A d erra a classificação: não há choque (perfusão adequada, PA mantida), sangramento grave nem disfunção de órgão."]}, {"n": 6, "title": "Dengue · classificação de gravidade", "tag": "NPC 01", "stem": "Qual a classificação de gravidade da paciente preconizada pelo Ministério da Saúde?", "opts": [["a", "Dengue Clássica"], ["b", "Dengue Hemorrágica"], ["c", "Dengue com Sinais de Alarme"], ["d", "Dengue Grave SUPREMO INC.                                                                 Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Refere-se a Mara (questão 5). A classificação atual tem três categorias: dengue, dengue com sinais de alarme e dengue grave (slides 28 e 29 da Aula 4 (Profa. Dionne; Supremo Slides p. 257 e 258)); \"clássica\" e \"hemorrágica\" pertencem à classificação antiga, abandonada. Mara tem dor abdominal intensa, vômitos persistentes e hipotensão postural, sem choque, sangramento grave ou disfunção orgânica: dengue com sinais de alarme (slide 30 da Aula 4 (Profa. Dionne; Supremo Slides p. 259))."]}, {"n": 7, "title": "Dengue · diagnóstico específico", "tag": "NPC 01", "stem": "Quais exames podem ser solicitados para confirmar o diagnóstico de Dengue no atendimento atual (segundo atendimento na UPA)?\nI. NS1\nII. Isolamento viral\nIII. RT-PCR", "opts": [["a", "I"], ["b", "I, II"], ["c", "I, III"], ["d", "II, III"], ["e", "I, II e III"]], "ans": "e", "cm": ["Mara está no 4º dia de doença. O slide de diagnóstico diz que a detecção de antígenos virais (NS1, isolamento viral, RT-PCR e imuno-histoquímica) deve ser solicitada até o quinto dia, e a sorologia ELISA a partir do sexto (slide 44 da Aula 4 (Profa. Dionne; Supremo Slides p. 273)). Os três exames são válidos no 4º dia."]}, {"n": 8, "title": "Betalactamases", "tag": "NPC 01", "stem": "Analise as afirmativas que tratam de β-lactamases e escolha a resposta CORRETA:\nI. A produção dessas enzimas é um importante mecanismo bacteriano de resistência aos antibióticos β-lactâmicos.\nPorque\nII. Essas enzimas promovem a hidrólise do anel β-lactâmico, impedindo que o antibiótico exerça adequadamente sua ação sobre a síntese proteica.", "opts": [["a", "As afirmações I e II são verdadeiras, e II justifica corretamente I."], ["b", "As afirmações I e II são verdadeiras, mas II não justifica I."], ["c", "A afirmação I é verdadeira e II é falsa."], ["d", "A afirmação I é falsa e II é verdadeira."], ["e", "As afirmações I e II são falsas."]], "ans": "c", "cm": ["I é verdadeira: inativação enzimática é um dos mecanismos gerais de resistência (slide 3 da Aula 2 (Prof. Érico; Supremo Slides p. 47); slide 37 da Aula 1 (Prof. Érico; Supremo Slides p. 40)). II começa certa (a enzima hidrolisa o anel β-lactâmico) mas termina errada: β-lactâmicos inibem a síntese da parede celular (peptidoglicano), não a síntese proteica, que é alvo de macrolídeos, aminoglicosídeos e tetraciclinas (slides 2 e 4 da Aula 2 (Prof. Érico; Supremo Slides p. 46 e 48)). Como escrita, II é falsa, então a resposta é c. É provável que a banca tenha querido escrever \"parede celular\" e marcado a; se o gabarito oficial vier a, cabe recurso pedindo anulação ou troca para c."]}, {"n": 9, "title": "Leptospirose · síndrome de Weil", "tag": "NPC 01", "stem": "Em relação à Leptospirose, nas infecções humanas, cerca de 10-15% evoluem para formas graves que cursam com a tríade de Weil, que consiste em:", "opts": [["a", "Insuficiência respiratória + dor abdominal + confusão mental."], ["b", "Icterícia + choque + hemorragia."], ["c", "Insuficiência renal aguda + anemia + febre."], ["d", "Hemorragia + febre + diarreia."], ["e", "Icterícia + insuficiência renal aguda + hemorragia"]], "ans": "e", "cm": ["A forma ictérica grave (doença de Weil) evolui com icterícia rubínica, disfunção renal e fenômenos hemorrágicos (slides 29 e 30 da Aula 6 (Profa. Dionne; Supremo Slides p. 462 e 463); IRA em slide 31 da Aula 6 (Profa. Dionne; Supremo Slides p. 464); hemorragias em slide 32 da Aula 6 (Profa. Dionne; Supremo Slides p. 465)). Essa é a tríade. Choque, insuficiência respiratória e alteração de consciência podem ocorrer, mas não compõem a tríade clássica."]}, {"n": 10, "title": "Chikungunya · fatores de cronificação", "tag": "NPC 01", "stem": "Qual das alternativas NÃO é considerada fator de risco para a forma crônica da Febre de Chikungunya?", "opts": [["a", "Idade > 40 anos, sexo masculino"], ["b", "Comorbidades prévias"], ["c", "Doença articular prévia"], ["d", "Intensidade das manifestações clínicas iniciais SUPREMO INC.                                                                   Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["O slide lista como fatores de risco para a forma crônica: \"Idade > 40 anos, sexo feminino; doença articular prévia; comorbidades prévias; intensidade das manifestações clínicas iniciais\" (slide 101 da Aula 4 (Profa. Dionne; Supremo Slides p. 330)). A alternativa a troca o sexo feminino por masculino: é o distrator típico, e por isso é a resposta.", "SUPREMO INC.                                                                                  Supremo Provas · NPC 01 · Infectologia"]}, {"n": 11, "title": "Tuberculose meningoencefálica · diagnóstico", "tag": "NPC 01", "stem": "Paulo, 35 anos, morador de rua, etilista (1litro de cachaça diariamente há 15 anos) compareceu UPA relatando febre, com mialgias e cefaleia há aproximadamente um mês. Há uma semana para desorientação e sonolência leve. Nega doenças prévias ou uso de antibióticos. Ao exame, T: 38,2 ºC, rigidez de nuca +/4+, desorientação no tempo e espaço. TC de crânio sem alterações. Liquor: 480 células/mcL (4% neutrófilos, 86% linfócitos, 10% monócitos), proteinas 152mg/dL (15-45), glicose 30 mg/dL (45-75). Qual a hipótese diagnóstica mais provável?", "opts": [["a", "Meningite viral"], ["b", "Meningite tuberculosa"], ["c", "Meningite meningocócica"], ["d", "Neurotoxoplasmose"]], "ans": "b", "cm": ["Nota de transcrição: Foto com o trecho do líquor desfocado: os números 480, 4%, 86%, 10% e 30 foram lidos com ampliação [termo incerto: 480? 86%? 30?]; somam 100% e são coerentes com o quadro.", "Quadro subagudo (mais de duas semanas) com cefaleia, febre e alteração de consciência, em etilista e morador de rua, é a TB meningoencefálica do slide: \"forma subaguda (> 2 semanas): cefaleia holocraniana, irritabilidade...\" (slides 50 e 51 da Aula 3 (Profa. Dionne; Supremo Slides p. 155 e 156)). O líquor confirma: pleocitose linfocítica moderada, proteína alta e glicose baixa. Meningite viral tem glicose normal e evolução aguda; a meningocócica é aguda, com predomínio neutrofílico; neurotoxoplasmose dá lesões expansivas com realce anelar na TC, em imunossuprimido."]}, {"n": 12, "title": "HIV · história natural", "tag": "SNC/HIV (práticas)", "stem": "Em relação à história natural da infecção pelo HIV, assinale a alternativa CORRETA:", "opts": [["a", "A síndrome retroviral aguda ocorre geralmente após 6 a 12 meses da infecção."], ["b", "A maioria dos indivíduos apresenta AIDS nos primeiros dois anos após a infecção."], ["c", "A síndrome retroviral aguda costuma ocorrer entre 2 e 4 semanas após a exposição ao HIV e está associada a elevada carga viral."], ["d", "A carga viral permanece indetectável durante a fase aguda da infecção."], ["e", "A soroconversão ocorre antes do aparecimento dos sintomas da infecção aguda."]], "ans": "c", "cm": ["A infecção aguda se manifesta 2 a 4 semanas após a exposição, com viremia muito alta (é a fase de maior transmissibilidade). A a erra o tempo; a b erra a história natural (a mediana até a AIDS sem tratamento é de cerca de 10 anos); a d inverte o que ocorre (a carga viral é máxima); a e inverte a sequência: os sintomas costumam preceder a soroconversão, por isso o teste de anticorpos pode ser negativo na fase aguda. Tema das práticas, sem slide no Supremo Slides."]}, {"n": 13, "title": "Leishmaniose visceral · diagnóstico", "tag": "NPC 01", "stem": "Márcio, 17 anos, procedente do município de Umirim, é internado com história que há 4 meses apresenta com febre de 38,5 ºC, intermitente, emagrecimento, anemia, epistaxes e hepatoesplenomegalia. O hemograma mostrou pancitopenia e a eletroforese de proteínas revelou hipoalbuminemia com hipergamaglobulinemia, com características de gamopatia policlonal. Qual exame é mais indicado para confirmar principal hipótese diagnóstica para esse caso?", "opts": [["a", "Hemocultura seriada, preferencialmente por método automatizado."], ["b", "ELISA."], ["c", "Imunofluorescência Indireta."], ["d", "rK39. SUPREMO INC.                                                                       Supremo Provas · NPC 01 · Infectologia"]], "ans": "d", "cm": ["Leishmaniose visceral típica. Entre as opções, o teste rápido imunocromatográfico rK39 é o indicado: o deck o indica para febre com esplenomegalia ou hepatomegalia (ou febre de 14 dias ou mais com citopenia) em área endêmica, e diz que é fácil, à beira do leito, e que, pela alta especificidade, quando positivo define o diagnóstico; a sensibilidade não é elevada, então o negativo não descarta (slides 52 e 54 da Aula 5 (Profa. Dionne; Supremo Slides p. 404 e 406)). O ELISA tem menor especificidade e é feito em laboratório (slide 55 da Aula 5 (Profa. Dionne; Supremo Slides p. 407)); a IFI é menos específica e exige estrutura; hemocultura não diagnostica Leishmania. O padrão-ouro parasitológico (aspirado de medula) não está entre as alternativas. É a mesma questão do Pedro na prova 2023.2 (questão 8), com outro nome."]}, {"n": 14, "title": "Tuberculose · tratamento preventivo (ILTB)", "tag": "NPC 01", "stem": "Paciente de 54 anos, sexo feminino, diagnóstico de artrite reumatoide e indicação de uso de medicamento imunobiológico. Foi encaminhada ao ambulatório de Infectologia pela Reumatologia, após realização de prova tuberculínica cujo resultado foi de 11 mm, para conduta em relação ao tratamento da infecção latente pelo Mycobacterium tuberculosis (ILTB). Foi afastada a hipótese de tuberculose ativa. Assinale a alternativa que contém esquemas disponíveis para o tratamento preventivo da tuberculose (TPT) recomendado pelo Ministério da saúde do Brasil (MS):\nI. Isoniazida + Rifapentina (3 meses)\nII. Isoniazida (6 ou meses)\nIII. Rifampicina (4 meses)", "opts": [["a", "I, II"], ["b", "I, III"], ["c", "II, III"], ["d", "I, II, III"]], "ans": "d", "cm": ["Nota de transcrição: \"Isoniazida (6 ou meses)\" como no original (falta o 9).", "O deck traz os esquemas de TPT do MS: isoniazida por 6 ou 9 meses (6H/9H), rifampicina por 4 meses (4R) e isoniazida + rifapentina semanal por 3 meses (3HP) (slides 111 e 115 da Aula 3 (Profa. Dionne; Supremo Slides p. 216 e 220); 3HP em slides 114 e 116 da Aula 3 (Profa. Dionne; Supremo Slides p. 219 e 221)). Os três estão disponíveis. PT de 11 mm em candidata a imunobiológico, com TB ativa afastada, é indicação de TPT. A falha de digitação no item II (\"6 ou meses\") não muda a resposta."]}, {"n": 15, "title": "Pneumonia comunitária · terapia empírica", "tag": "NPC 01", "stem": "Homem de 68 anos, hipertenso e diabético, procura atendimento com febre há três dias, tosse produtiva com expectoração amarelada, dispneia e dor torácica ventilatório-dependente. A radiografia de tórax mostra infiltrado lobar em base direita. O paciente encontra-se hemodinamicamente estável e necessita de internação hospitalar em enfermaria. A melhor conduta inicial em relação à antibioticoterapia é:", "opts": [["a", "Aguardar o resultado da cultura do escarro antes de iniciar qualquer antimicrobiano."], ["b", "Iniciar terapia antimicrobiana empírica baseada nos agentes mais prováveis para pneumonia adquirida na comunidade."], ["c", "Iniciar vancomicina isoladamente para cobertura de MRSA."], ["d", "Prescrever apenas tratamento sintomático, pois a maioria das pneumonias é viral."], ["e", "Solicitar e aguardar resultado de hemocultura."]], "ans": "b", "cm": ["Terapia empírica é a usada quando o agente não foi identificado e existe risco na espera, a forma mais comum na prática (slide 20 da Aula 1 (Prof. Érico; Supremo Slides p. 23)), guiada pelo quadro clínico, foco, idade e origem comunitária ou hospitalar (slide 21 da Aula 1 (Prof. Érico; Supremo Slides p. 24)). Pneumonia lobar com indicação de internação não pode esperar culturas (a, e). Vancomicina isolada não cobre os agentes típicos da PAC (pneumococo é coberto, mas não Haemophilus, Moraxella e atípicos) e MRSA não é o agente provável (c). Infiltrado lobar com escarro purulento é bacteriano (d).", "SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]}, {"n": 16, "title": "Meningite bacteriana · conduta inicial", "tag": "SNC/HIV (práticas)", "stem": "Leandro, 5 anos, sexo masculino foi atendido na emergência do HIAS com história de febre e vômitos há 24 horas. Exame físico: FC: 118 bpm. FR: 30 ipm. Estado geral comprometido, febril, eupneico, hipocorado (2+/4+), desidratado (+/4+), consciente, porém sonolento. ACP: sem alterações. Abdome: plano, flácido, indolor, sem visceromegalias. SN: rigidez de nuca presente, pupilas isocóricas e fotorreagentes, fundo de olho normal, Glasgow 14. Pele: presença de petéquias em membros inferiores. Qual a conduta recomendada?", "opts": [["a", "Coletar líquor e aguardar seu resultado para definir início de antibioticoterapia."], ["b", "Coletar líquor e hemocultura e iniciar antibioticoterapia empírica."], ["c", "Coletar líquor e hemocultura e aguardar resultado do líquor para definir início de antibioticoterapia."], ["d", "Coletar hemocultura, iniciar antibioticoterapia empírica, realizar tomografia computadorizada de crânio de urgência para definir coleta de líquor. SUPREMO INC.                                                                    Supremo Provas · NPC 01 · Infectologia"]], "ans": "b", "cm": ["Meningite bacteriana provável (febre, vômitos, rigidez de nuca, petéquias sugerindo meningococo): coleta-se hemocultura e líquor e inicia-se antibiótico empírico sem esperar resultados (a e c atrasam o tratamento). A TC antes da punção (d) fica para déficit focal, papiledema, convulsão recente, imunossupressão ou rebaixamento importante de consciência; Leandro tem pupilas normais, fundo de olho normal e Glasgow 14, então a punção não deve ser adiada. Tema das práticas (SNC), sem slide no Supremo Slides."]}, {"n": 17, "title": "Associação de antimicrobianos", "tag": "NPC 01", "stem": "Analise as afirmativas e escolha a resposta CORRETA:\nI. A associação de antimicrobianos pode ser indicada no tratamento inicial de algumas infecções graves.\nPorque\nII. Uma das finalidades dessa estratégia é ampliar a cobertura antimicrobiana enquanto o agente etiológico ainda não foi identificado.", "opts": [["a", "As afirmações I e II são verdadeiras e II justifica corretamente I."], ["b", "As afirmações I e II são verdadeiras, mas II não justifica I."], ["c", "A afirmação I é verdadeira e II é falsa."], ["d", "A afirmação I é falsa e II é verdadeira."], ["e", "As afirmações I e II são falsas."]], "ans": "a", "cm": ["Indicações de associação no slide: \"terapia empírica com causa da infecção desconhecida, cobertura mais ampla\", infecções polimicrobianas, prevenir resistência e sinergismo (slide 30 da Aula 1 (Prof. Érico; Supremo Slides p. 33)). I é verdadeira e II é exatamente a primeira indicação do slide, que explica I. O caso Severino (vancomicina + cefepima empíricas, depois descalonadas) ilustra a mesma lógica (slides 25 e 26 da Aula 1 (Prof. Érico; Supremo Slides p. 28 e 29))."]}, {"n": 18, "title": "Tuberculose meníngea · fase de manutenção", "tag": "NPC 01", "stem": "Paciente com 19 anos foi diagnosticado com meningite tuberculosa. Assinale a alternativa CORRETA em relação ao tratamento da fase de manutenção mais indicado após a fase intensiva com Rifampicina + Isoniazida + Pirazinamida + Etambutol (por 2 meses):", "opts": [["a", "Rifampicina + Isoniazida por 6 meses"], ["b", "Rifampicina + Isoniazida por 08 meses"], ["c", "Rifampicina + Isoniazida por 10 meses"], ["d", "Rifampicina + Isoniazida por 12 meses"]], "ans": "c", "cm": ["\"TB meníngea e óssea: a fase de manutenção tem duração de 10 meses e o tempo total do tratamento é de 12 meses\" (slide 95 da Aula 3 (Profa. Dionne; Supremo Slides p. 200)). A d é o distrator do tempo total; a a é um erro comum (6 meses é o total do esquema básico, cuja manutenção é de 4 meses)."]}, {"n": 19, "title": "Vancomicina", "tag": "NPC 01", "stem": "Em relação à vancomicina, assinale a alternativa CORRETA:", "opts": [["a", "Atua inibindo a síntese proteica ao se ligar à subunidade 30S do ribossomo bacteriano."], ["b", "Possui excelente atividade contra a maioria dos bacilos Gram-negativos."], ["c", "É considerada o tratamento de escolha para infecções causadas por bactérias intracelulares atípicas."], ["d", "Apresenta absorção oral elevada, sendo a via oral preferencial para infecções sistêmicas."], ["e", "Inibe a síntese da parede celular ao se ligar aos precursores do peptidoglicano, sendo particularmente útil contra cocos Gram-positivos. SUPREMO INC.                                                                  Supremo Provas · NPC 01 · Infectologia"]], "ans": "e", "cm": ["Glicopeptídeo: inibição primária da biossíntese da parede celular (slide 54 da Aula 2 (Prof. Érico; Supremo Slides p. 98)), com espectro \"exclusivo em Gram-positivos\" (estafilococos inclusive MRSA, estreptococos, enterococos) e sem ação sobre Gram-negativos (slide 55 da Aula 2 (Prof. Érico; Supremo Slides p. 99)). A a descreve aminoglicosídeos/tetraciclinas; a b contraria o espectro; a c é papel de macrolídeos, quinolonas respiratórias e tetraciclinas; a d está errada: a vancomicina praticamente não é absorvida por via oral (a via oral só serve para colite por C. difficile), e no deck ela é venosa, com alvo AUC/MIC (slide 57 da Aula 2 (Prof. Érico; Supremo Slides p. 101))."]}, {"n": 20, "title": "Dengue · grupo C e exames", "tag": "NPC 01", "stem": "Margarida, 43 anos, procurou a UBS referindo que há 4 dias iniciou quadro de febre elevada de início abrupto, cefaleia, mialgia e náuseas. Há cerca de 12h refere piora com vários episódios de vômito e intensa dor abdominal. Diante da hipótese de Dengue, qual a conduta recomendada segundo o Ministério da Saúde?", "opts": [["a", "Grupo B, realizar hemograma e detecção de antígeno viral (NS1) obrigatórios. Hidratação endovenosa em leito hospitalar."], ["b", "Grupo C, realizar hemograma, albumina e sorologia (IgM e IgG) obrigatórios. Hidratação endovenosa em leito hospitalar."], ["c", "Grupo B, realizar hemograma obrigatório e hidratação oral supervisionada na APS até resultado do hemograma."], ["d", "Grupo C, realizar hemograma, albumina e detecção de antígeno viral (NS1) obrigatórios. Hidratação endovenosa em leito hospitalar."]], "ans": "d", "cm": ["Vômitos persistentes e dor abdominal intensa são sinais de alarme (slide 30 da Aula 4 (Profa. Dionne; Supremo Slides p. 259)): grupo C, com internação, hidratação venosa e \"realizar exames específicos\" (slide 63 da Aula 4 (Profa. Dionne; Supremo Slides p. 292)). Isso elimina a e c (grupo B). Entre b e d decide o dia de doença: no 4º dia o exame específico é NS1 (até o 5º dia); a sorologia só a partir do 6º (slide 44 da Aula 4 (Profa. Dionne; Supremo Slides p. 273)). O manual do MS (2024) lista hemograma, albumina e transaminases como obrigatórios no grupo C, com exame específico obrigatório; a alternativa omite as transaminases, mas é a única coerente.", "SUPREMO INC.                                                                                  Supremo Provas · NPC 01 · Infectologia"]}, {"n": 21, "title": "Melioidose · assertivas", "tag": "NPC 01", "stem": "Analise as afirmativas abaixo em relação a Melioidose:\nI. O diagnóstico é feito por cultura microbiológica.\nII. Homens e animais adquirem a infecção em contato com o ambiente através de exposição a solo e água.\nIII. A doença apresenta amplo espectro clínico o que dificulta seu diagnóstico.\nIV. A Burkholderia pseudomallei é sensível aos antimicrobianos utilizados em infecções comunitárias comuns.\nAssinale a alternativa CORRETA:", "opts": [["a", "I, II"], ["b", "I, III"], ["c", "I, II, III"], ["d", "II, III, IV"], ["e", "I, II, III, IV"]], "ans": "c", "cm": ["I: cultura microbiológica é o padrão-ouro (slide 41 da Aula 7 (Profa. Dionne; Supremo Slides p. 528)). II: transmissão ambiental por solo e água, com exposição ocupacional e de lazer (slides 28 e 29 da Aula 7 (Profa. Dionne; Supremo Slides p. 515 e 516)). III: \"ampla diversidade clínica\" e \"doença imitadora\" (slide 4 da Aula 7 (Profa. Dionne; Supremo Slides p. 491); slide 33 da Aula 7 (Profa. Dionne; Supremo Slides p. 520)). IV é falsa: o tratamento exige ceftazidima ou meropenem e depois SMX-TMP (slides 51 e 53 da Aula 7 (Profa. Dionne; Supremo Slides p. 538 e 540)); a bactéria é intrinsecamente resistente a vários antibióticos de uso comunitário (penicilina, cefalosporinas de 1ª e 2ª geração, aminoglicosídeos), o que contribui para a mortalidade."]}, {"n": 22, "title": "Tuberculose pulmonar · propedêutica", "tag": "NPC 01", "stem": "Paciente feminina, 40 anos, procura UBS com queixa de tosse há 3 meses e escarros hemoptóicos há 1 semana. Refere perda de peso não intencional de 8kg (antes pesava 70kg). Nega febre, mas refere adinamia. Qual das alternativas abaixo contêm a propedêutica diagnóstica mais adequada?", "opts": [["a", "Teste Rápido Molecular para tuberculose (GeneXpert) no escarro e anti HIV"], ["b", "Hemograma completo e Teste Tuberculínico (PPD)"], ["c", "Bacterioscopia do escarro com coloração pelo Gram e PPD"], ["d", "Baciloscopia do lavado broncoalveolar com cultura para BK. SUPREMO INC.                                                                 Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["Sintomática respiratória (tosse > 3 semanas) com emagrecimento: o TRM-TB no escarro é o exame inicial para diagnóstico de TB pulmonar (slides 61 e 62 da Aula 3 (Profa. Dionne; Supremo Slides p. 166 e 167); fluxograma em slide 68 da Aula 3 (Profa. Dionne; Supremo Slides p. 173)), e todo paciente com TB deve ser testado para HIV (coinfecção, slide 54 da Aula 3 (Profa. Dionne; Supremo Slides p. 159)). PPD identifica infecção, não doença ativa em adulto (slide 84 da Aula 3 (Profa. Dionne; Supremo Slides p. 189)); Gram não vê micobactéria; lavado broncoalveolar é invasivo e só se indica se o escarro for inviável ou negativo com suspeita mantida. Mesma questão da prova 2023.2 (questão 3)."]}, {"n": 23, "title": "HIV · testagem", "tag": "SNC/HIV (práticas)", "stem": "Em relação às recomendações atuais para testagem do HIV, analise as afirmativas abaixo:\n( ) A oferta do teste para HIV deve ser priorizada para populações-chave, como homens que fazem sexo com homens (HSH), mulheres trans, profissionais do sexo e usuários de drogas, devido à maior prevalência da infecção nesses grupos.\n( ) Pessoas pertencentes a populações-chave devem realizar testagem para HIV com maior frequência do que a população geral.\n( ) A testagem para HIV deve ser oferecida a todas as pessoas que têm ou tiveram vida sexual ativa, independentemente de pertencerem ou não a populações-chave.\n( ) O diagnóstico precoce da infecção pelo HIV traz benefícios individuais e contribui para a prevenção da transmissão do vírus.\nAssinale a alternativa que apresenta a sequência CORRETA:", "opts": [["a", "V – V – V – V"], ["b", "V – F – V – V"], ["c", "F – V – V – V"], ["d", "V – V – F – V"], ["e", "V – F – F – V"]], "ans": "a", "cm": ["As quatro afirmativas refletem as recomendações do Ministério da Saúde: priorização e maior frequência de testagem para populações-chave (prevalência muito maior), oferta universal a quem tem ou teve vida sexual ativa e diagnóstico precoce como benefício individual e estratégia de prevenção (tratamento como prevenção). Não há afirmativa falsa. Tema das práticas, sem slide no Supremo Slides."]}, {"n": 24, "title": "Prova tuberculínica", "tag": "NPC 01", "stem": "Assinale a alternativa CORRETA em relação a prova tuberculínica (PPD):\nI. Está indicada para identificar casos ILTB em adultos e crianças.\nII. Auxilia o diagnóstico de TB ativa em crianças.\nIII. Não deve ser utilizada no paciente infectado pelo HIV.\nIV. Deve ser realizada antes da aplicação da vacina BCG.", "opts": [["a", "I, II"], ["b", "I e III."], ["c", "III e IV."], ["d", "I, II e IV. SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["O slide da prova tuberculínica tem exatamente as duas indicações: \"identificar casos ILTB em adultos e crianças\" e \"auxiliar no diagnóstico de TB ativa em crianças\" (slide 84 da Aula 3 (Profa. Dionne; Supremo Slides p. 189)). III é falsa: PVHIV são prioridade para rastreio de ILTB com PT (ou IGRA). IV é falsa: \"não se indica a realização prévia de teste tuberculínico para administração da vacina BCG\" (slide 107 da Aula 3 (Profa. Dionne; Supremo Slides p. 212)). Mesma questão da prova 2023.2 (questão 2)."]}, {"n": 25, "title": "HIV · prevenção combinada", "tag": "SNC/HIV (práticas)", "stem": "Sobre a prevenção da infecção pelo HIV, escolha a opção correta que melhor estabelece a correlação entre as intervenções (coluna A) e as assertivas (coluna B)\nColuna A: (1) PrEP · (2) PEP · (3) Tratamento das pessoas vivendo com HIV · (4) Preservativos · (5) Testagem para HIV e IST\nColuna B:\n( ) Uso contínuo de medicamentos antirretrovirais por pessoas vivendo com HIV para alcançar carga viral indetectável e eliminar a transmissão sexual do vírus.\n( ) Uso de antirretrovirais por pessoas HIV-negativas antes de exposições de risco, reduzindo a probabilidade de infecção pelo HIV.\n( ) Uso de antirretrovirais por até 28 dias após uma exposição de risco ao HIV, devendo ser iniciado o mais precocemente possível.\n( ) Estratégia de barreira que reduz a transmissão do HIV e de outras infecções sexualmente transmissíveis.\n( ) Permite diagnóstico precoce, vinculação ao cuidado e acesso oportuno às demais estratégias de prevenção.\nAssinale a alternativa que apresenta a sequência correta da Coluna B, de cima para baixo:", "opts": [["a", "3 – 1 – 4 – 2 – 5"], ["b", "1 – 2 – 3 – 4 – 5"], ["c", "3 – 2 – 1 – 4 – 5"], ["d", "2 – 1 – 3 – 5 – 4"], ["e", "3 – 1 – 2 – 4 – 5"]], "ans": "e", "cm": ["Nota de transcrição: No original, as colunas A e B estão lado a lado em tabela; aqui, em sequência. Carga viral indetectável por TARV = tratamento das PVHIV (3, \"indetectável = intransmissível\"); antirretroviral antes da exposição = PrEP (1); por 28 dias após a exposição = PEP (2); barreira = preservativo (4); diagnóstico precoce e vinculação = testagem (5). Sequência 3-1-2-4-5. Tema das práticas, sem slide no Supremo Slides.", "SUPREMO INC.                                                                          Supremo Provas · NPC 01 · Infectologia"]}]}, {"id": 2, "title": "Prova 2023.2                                                  ", "sub": "Prova de Infectologia, 2023.2", "intro": "Fonte: Provas antigas/Prova 2023.2 (fotos).pdf (4 fotos do caderno, com marcações e anotações de um aluno); conferida com a transcrição de Benjamim Vieira (Compilado, p. 9-13) Transcrição integral das 20 questões, com a numeração do original preservada nas notas (a questão 5 aparece como \"5. 18.\" e a seguinte também como 5; não há questão 6). As marcações do aluno nas fotos não foram usadas como gabarito: cada resposta foi determinada de forma independente e as divergências estão nos comentários. A transcrição do compilado, com gabarito gerado pelo Gemini, serviu só para conferência.", "qs": [{"n": 1, "title": "Tuberculose · esquema básico", "tag": "NPC 01", "stem": "Paciente com 35 anos de idade e 66 kg com TRM (Genexpert) detectável e sensível a rifampicina no escarro e em fragmento de linfonodo cervical, obtido por biópsia, o esquema de tratamento deve ser:", "opts": [["a", "Rifampicina, Isoniazida, Pirazinamida por 2 meses seguido por Rifampicina, Isoniazida por 4 meses."], ["b", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 10 meses."], ["c", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 6 meses."], ["d", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 4 meses."]], "ans": "d", "cm": ["Nota de transcrição: Alternativa d com \"fampicina\" no início (a letra R ficou sob a marcação do aluno na foto). TB pulmonar e ganglionar sensível à rifampicina em adulto: esquema básico 2RHZE/4RH (slides 93 e 94 da Aula 3 (Profa. Dionne; Supremo Slides p. 198 e 199)); com 66 kg, 4 comprimidos em dose fixa combinada. A extensão para 10 meses de manutenção (b) é exclusiva das formas meníngea e óssea (slide 95 da Aula 3 (Profa. Dionne; Supremo Slides p. 200)). A a omite o etambutol, que faz parte da fase intensiva do adulto; a c não existe no PCDT. O aluno marcou d; confere."]}, {"n": 2, "title": "Prova tuberculínica", "tag": "NPC 01", "stem": "Assinale a alternativa CORRETAS em relação a prova tuberculínica (PPD):\nI. Está indicada para identificar casos ILTB em adultos e crianças.\nII. Auxilia o diagnóstico de TB ativa em crianças.\nIII. Não deve ser utilizada no paciente infectado pelo HIV.\nIV. Deve ser realizada antes da aplicação da vacina BCG.", "opts": [["a", "I, II"], ["b", "I e III."], ["c", "III e IV."], ["d", "I, II e IV."]], "ans": "a", "cm": ["Nota de transcrição: Alternativas parcialmente cobertas por rabiscos do aluno; texto conferido com a questão 24 da prova 2026.1, idêntica.", "I e II são literalmente o slide da prova tuberculínica (slide 84 da Aula 3 (Profa. Dionne; Supremo Slides p. 189)). III é falsa: PVHIV são prioridade no rastreio de ILTB. IV é falsa: não se faz PT antes da BCG (slide 107 da Aula 3 (Profa. Dionne; Supremo Slides p. 212)). O aluno marcou b, e o gabarito do compilado (Gemini) aponta I e II; a resposta é a. Repetida na 2026.1 (questão 24)."]}, {"n": 3, "title": "Tuberculose pulmonar · propedêutica", "tag": "NPC 01", "stem": "Paciente feminina, 40 anos, procura UBS com queixa de tosse há 3 meses e escarros hemoptóicos há 1 semana. Refere perda de peso não intencional de 8kg (antes pesava 70kg). Nega febre, mas refere adinamia. Rx de tórax em anexo. Qual das alternativas abaixo contêm a propedêutica diagnóstica mais adequada?", "opts": [["a", "Teste Rápido Molecular para tuberculose (GeneXpert) no escarro e anti HIV"], ["b", "Hemograma completo e Teste Tuberculínico (PPD)"], ["c", "Bacterioscopia do escarro com coloração pelo Gram e PPD"], ["d", "Baciloscopia do lavado broncoalveolar com cultura para BK2. SUPREMO INC.                                                                    Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["Nota de transcrição: O \"Rx de tórax em anexo\" não aparece nas fotos. \"BK2\" como no original (na 2026.1, \"BK\"). TRM-TB no escarro é o exame inicial no sintomático respiratório (slides 61 e 62 da Aula 3 (Profa. Dionne; Supremo Slides p. 166 e 167)), e todo caso de TB deve ser testado para HIV (slide 54 da Aula 3 (Profa. Dionne; Supremo Slides p. 159)). PPD não diagnostica TB ativa em adulto (slide 84 da Aula 3 (Profa. Dionne; Supremo Slides p. 189)); Gram não cora micobactéria; o lavado é invasivo e desnecessário com escarro disponível. O aluno marcou c; a resposta é a. Repetida na 2026.1 (questão 22)."]}, {"n": 4, "title": "Síndrome febril aguda indiferenciada", "tag": "NPC 01", "stem": "Josias, 23 anos, entregador, relata que há 3 dias apresenta febre elevada (39ºC) associada a adinamia, cefaleia intensa, artralgia e mialgia importantes. Exame físico sem alterações. Assinale a alternativa MAIS CORRETA em relação à abordagem diagnóstica:", "opts": [["a", "Quadro clínico característico de virose inespecífica. Por possuir caráter benigno e autolimitado, não há necessidade de investigação."], ["b", "Epidemiologia sugere leptospirose, pois deve ter contato no trabalho com detritos contaminados. Iniciar antibioticoterapia."], ["c", "Compatível com síndrome febril aguda indiferenciada. Investigar sinais de alarme, exposições e solicitar exames laboratoriais gerais."], ["d", "Quadro clínico é característico da forma benigna da dengue. Devemos solicitar a coleta imediata de sorologia."]], "ans": "c", "cm": ["Febre aguda com cefaleia, artralgia e mialgia, sem foco, é síndrome febril aguda: dengue, chikungunya, zika e leptospirose entram no diferencial (slide 46 da Aula 4 (Profa. Dionne; Supremo Slides p. 275); slide 105 da Aula 4 (Profa. Dionne; Supremo Slides p. 334)). A abordagem do deck é estratificar risco, buscar sinais de alarme e considerar exames inespecíficos e específicos (slides 47 e 53 da Aula 4 (Profa. Dionne; Supremo Slides p. 276 e 282)). A a ignora esse risco; a b afirma uma exposição que o caso não traz; a d erra o momento: sorologia só a partir do 6º dia (slide 44 da Aula 4 (Profa. Dionne; Supremo Slides p. 273)). O aluno marcou c; confere."]}, {"n": 5, "title": "Dengue · sinais de alarme", "tag": "NPC 01", "stem": "Homem com 29 anos de idade, sem comorbidades relatadas, comparece para atendimento médico na UBS, relatando estar doente há 5 dias, com febre, náusea, vômitos persistentes e petéquias. Ao exame encontra-se letárgico, anictérico, eupneico e com hipotensão postural documentada. Assinale abaixo a alternativa com a melhor recomendação, para o referido paciente, de acordo com o Ministério da Saúde do Brasil:", "opts": [["a", "Dengue provável, aguardar exame confirmatório e fazer acompanhamento ambulatorial."], ["b", "Dengue provável, notificar e internar em UTI devido sinais de alarme."], ["c", "Solicitar sorologia imediatamente para confirmar dengue e notificar e internar paciente"], ["d", "em enfermaria."], ["e", "Dengue provável com sinais de alarme, notificar e internar em enfermaria"]], "ans": "e", "cm": ["Nota de transcrição: Numerada \"5. 18.\" no original. A alternativa d (\"em enfermaria.\") é, na prática, a continuação da c, quebrada em outra letra na diagramação; mantida como veio.", "Vômitos persistentes, letargia e hipotensão postural são sinais de alarme (slide 30 da Aula 4 (Profa. Dionne; Supremo Slides p. 259)): grupo C, internação em leito hospitalar (emergência ou enfermaria) com hidratação venosa e notificação (slides 62 e 63 da Aula 4 (Profa. Dionne; Supremo Slides p. 291 e 292)). Não há choque, sangramento grave nem disfunção orgânica para UTI (b, grupo D). A a ignora os sinais de alarme; a c condiciona a conduta a um exame que não deve atrasá-la e, no 5º dia, sorologia ainda não é o exame adequado (slide 44 da Aula 4 (Profa. Dionne; Supremo Slides p. 273)). O aluno marcou e; confere. Repetida no compilado com o texto da b reconstruído.", "SUPREMO INC.                                                                                   Supremo Provas · NPC 01 · Infectologia"]}, {"n": 6, "title": "Chikungunya · fase aguda", "tag": "NPC 01", "stem": "Dona Margarida, 59 anos, procurou a UPA apresentando há 5 dias febre de início súbito associada a artralgia intensa, com edema articular, acometendo sobretudo mãos, punhos, tornozelos e pés, há 5 dias. Relatou, ainda astenia, mialgia, cefaleia e exantema maculopapular sem prurido cutâneo. Considerando o diagnóstico mais provável para essa paciente, assinale alternativa CORRETA:", "opts": [["a", "Não existe tratamento específico nem vacina disponível para prevenir a infecção por esse vírus. O tratamento sintomático, portanto, é o indicado."], ["b", "Na fase aguda com quadro de artralgia intensa, está indicado o uso de corticoide para redução do processo inflamatório."], ["c", "O comprometimento de múltiplas articulações é comum, entretanto a possibilidade de cronificação desses sintomas é mínima."], ["d", "Os sintomas da doença costumam persistir por 7 a 10 dias, com predominância de dores nas articulações que podem durar somente durante o período de viremia, ocorrendo a diminuição e o desaparecimento desse sintoma no final da fase aguda da doença. SUPREMO INC.                                                                    Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["Nota de transcrição: Numerada \"5.\" no original (repete o número da anterior).", "Poliartralgia/poliartrite distal simétrica, incapacitante, com edema: chikungunya aguda (slide 88 da Aula 4 (Profa. Dionne; Supremo Slides p. 317)). b: corticoide não é indicado na fase aguda (reserva-se à subaguda). c: a cronificação ocorre em 40 a 50% (slide 101 da Aula 4 (Profa. Dionne; Supremo Slides p. 330)). d: a dor articular persiste além da viremia, com fase subaguda em 50 a 90% (slide 95 da Aula 4 (Profa. Dionne; Supremo Slides p. 324)). Resposta a. Atenção: a parte \"nem vacina disponível\" envelheceu. A Anvisa aprovou em abril de 2025 a vacina contra chikungunya do Butantan/Valneva; o slide de prevenção cita só as vacinas de febre amarela e dengue (slide 121 da Aula 4 (Profa. Dionne; Supremo Slides p. 350)). Pelo slide, a continua sendo a resposta; numa questão nova, desconfie de \"não existe vacina\". O aluno marcou a; confere."]}, {"n": 7, "title": "Leptospirose · laboratório", "tag": "NPC 01", "stem": "Qual alteração laboratorial está presente na leptospirose, especialmente na forma moderada e grave?", "opts": [["a", "Transaminases com aumento superior a dez vezes o valor da referência."], ["b", "Tempo de protrombina (TAP) normal ou diminuído."], ["c", "Elevação das bilirrubinas totais com predomínio da fração direta."], ["d", "Potássio sérico normal ou aumentado."]], "ans": "c", "cm": ["O slide lista \"elevação das bilirrubinas\" e \"transaminases normais ou aumento de 3 a 5 (TGO > TGP)\" (slide 47 da Aula 6 (Profa. Dionne; Supremo Slides p. 480)); a icterícia rubínica é por hiperbilirrubinemia predominantemente direta. A a contraria o \"3 a 5 vezes\". A d inverte o slide da IRA: potássio \"normais ou diminuídos, raramente elevados\" (slide 31 da Aula 6 (Profa. Dionne; Supremo Slides p. 464)). A b é a mais confusa: o slide cita \"atividade de protrombina ou tempo de protrombina\" sem dizer o sentido; nas formas graves o tempo está prolongado (atividade reduzida), então \"tempo normal ou diminuído\" está errado. O aluno marcou c; confere."]}, {"n": 8, "title": "Leishmaniose visceral · diagnóstico", "tag": "NPC 01", "stem": "Pedro, 14 anos, procedente do município de Jucás, é internado com história que há 4 meses apresenta com febre de 38,5 ºC, intermitente, emagrecimento, anemia, epistaxes e hepatoesplenomegalia. O hemograma revelava pancitopenia e a eletroforese de proteínas revelou hipoalbuminemia com hipergamaglobulinemia, com características de gamopatia policlonal. Qual exame é mais indicado para confirmar principal hipótese diagnóstica para esse caso?", "opts": [["a", "Hemocultura seriada, preferencialmente por método automatizado."], ["b", "ELISA."], ["c", "Imunofluorescência Indireta."], ["d", "rK39."]], "ans": "d", "cm": ["LV clássica (febre prolongada, pancitopenia, hepatoesplenomegalia, inversão albumina/globulina). O teste rápido rK39 está indicado justamente para febre com esplenomegalia em área endêmica e, positivo, define o diagnóstico pela alta especificidade (slides 52 e 54 da Aula 5 (Profa. Dionne; Supremo Slides p. 404 e 406)). ELISA e IFI são menos específicos e laboratoriais (slide 55 da Aula 5 (Profa. Dionne; Supremo Slides p. 407)). O aluno marcou d; confere. Repetida na 2026.1 (Márcio, questão 13)."]}, {"n": 9, "title": "Leishmaniose visceral · tratamento", "tag": "NPC 01", "stem": "Qual é a droga recomendada para tratamento do Pedro, segundo recomendação do Ministério da Saúde (MS)?", "opts": [["a", "Anfotericina B desoxicolato."], ["b", "Anfotericina B lipossomal."], ["c", "Antimoniato pentavalente."], ["d", "Alopurinol."]], "ans": "c", "cm": ["Pedro tem 14 anos e nenhum critério do deck para anfotericina lipossomal (idade < 1 ou > 50 anos, disfunção renal/hepática/cardíaca, QTc longo, HIV, imunossupressão, gestação, falha, escores de gravidade elevados; slides 70 e 71 da Aula 5 (Profa. Dionne; Supremo Slides p. 422 e 423)). Primeira escolha: antimoniato de N-metil glucamina, 20 mg/kg/dia por 20 a 40 dias (slide 64 da Aula 5 (Profa. Dionne; Supremo Slides p. 416)). A epistaxe isolada não basta para o escore de gravidade. A incorporação das anfotericinas lipídicas pela Conitec (junho de 2026) não mudou a primeira escolha da maioria dos casos. O aluno marcou c; confere."]}, {"n": 10, "title": "Leishmaniose visceral · laboratório", "tag": "NPC 01", "stem": "Os achados laboratoriais típicos da leishmaniose visceral (calazar) são:", "opts": [["a", "Leucograma normal, anemia hipocrômica e microcítica, plaquetopenia e hipoalbuminemia."], ["b", "Leucocitose, com linfocitose e atipia linfocitária, anemia macrocítica, plaquetopenia e elevação das transaminases."], ["c", "Leucopenia e anemia, com plaquetose, elevação discreta das transaminases e hipogamaglobulinemia."], ["d", "Leucopenia, com neutropenia e linfocitose relativa, anemia, plaquetopenia e inversão albumina-globulina. SUPREMO INC.                                                                    Supremo Provas · NPC 01 · Infectologia"]], "ans": "d", "cm": ["Nota de transcrição: O compilado transcreve \"linfocitose reativa\"; a foto mostra \"relativa\".", "Pancitopenia (leucopenia com neutropenia e linfocitose relativa, anemia normocítica e plaquetopenia) e inversão albumina/globulina por hipergamaglobulinemia policlonal são os achados clássicos, os mesmos dos casos de Pedro e Márcio. O deck pede hemograma e eletroforese de proteínas como exames inespecíficos (slide 56 da Aula 5 (Profa. Dionne; Supremo Slides p. 408)). a: leucograma não é normal. b: é o perfil da mononucleose. c: há plaquetopenia e HIPERgamaglobulinemia.", "SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]}, {"n": 11, "title": "Escolha de antimicrobiano · meningococo", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n11. Paciente com 12 anos com meningite aguda por Neisseria meningitidis pan-sensível. ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina."]], "ans": "e", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Meningococo sensível à penicilina: penicilina G cristalina IV em dose meníngea é o tratamento dirigido clássico (ceftriaxona também serve, mas não está na lista, daí o desabafo do aluno \"cadê a ceftriaxona\"). Cefalexina e oxacilina não atingem o LCR em níveis adequados; vancomicina e meropenem seriam espectro desnecessário para agente pan-sensível (terapia definitiva, mais estreita: slide 22 da Aula 1 (Prof. Érico; Supremo Slides p. 25)). O aluno marcou C; a resposta é E."]}, {"n": 12, "title": "Escolha de antimicrobiano · impetigo", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n12. Criança com 6 anos, com lesões de impetigo ao redor da boca e nariz ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina."]], "ans": "a", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Impetigo (S. aureus e S. pyogenes) em criança, ambulatorial: quando não basta o tópico, a escolha oral é cefalosporina de 1ª geração, cujo uso massivo é pele e partes moles (slide 43 da Aula 2 (Prof. Érico; Supremo Slides p. 87)). Oxacilina é venosa, para infecções que exigem internação. O aluno marcou B; a resposta é A."]}, {"n": 13, "title": "Escolha de antimicrobiano · S. aureus em imunossuprimido", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n13. Paciente com 62 anos, em quimioterapia para câncer de colo de útero, apresenta celulite extensa em membro inferior direito após corte local. Hemocultura: Staphylococcus aureus ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina. SUPREMO INC.                                                                  Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Bacteremia por S. aureus ainda sem antibiograma, em paciente em quimioterapia (contato frequente com serviço de saúde): enquanto a sensibilidade é desconhecida, cobre-se MRSA com vancomicina e, se vier sensível à oxacilina, descalona-se. É exatamente a lógica do caso Severino do Prof. Érico (slides 25 e 26 da Aula 1 (Prof. Érico; Supremo Slides p. 28 e 29)). A lista tem seis situações e cinco drogas, e a 16 (celulite simples, sem bacteremia) pede oxacilina; a diferença está no contexto de risco. Oxacilina (B) é defensável se a banca considerar o S. aureus comunitário sensível: ponto de recurso. O aluno marcou A (cefalexina, oral, inadequada para bacteremia)."]}, {"n": 14, "title": "Escolha de antimicrobiano · pneumonia hospitalar", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n14. Paciente de 75 anos, internada há 6 dias por Infarto Agudo do Miocárdio, evolui com pneumonia. Bacterioscopia (hemocultura): bacilos Gram negativos ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina."]], "ans": "d", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Origem hospitalar muda o agente provável (slide 21 da Aula 1 (Prof. Érico; Supremo Slides p. 24)): bacilo Gram-negativo após 6 dias de internação pede cobertura ampla de Gram-negativos hospitalares, inclusive Pseudomonas e produtores de betalactamase de espectro estendido. Na lista, só o meropenem cobre. O aluno marcou D; confere."]}, {"n": 15, "title": "Escolha de antimicrobiano · ITU na gestante", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n15. Gestante de 28 semanas, com quadro de infecção urinária baixa, não complicada ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina."]], "ans": "a", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Gravidez é fator do paciente na escolha (slide 29 da Aula 1 (Prof. Érico; Supremo Slides p. 32)): evitam-se tetraciclinas, quinolonas (contraindicadas em gestantes, slide 18 da Aula 2 (Prof. Érico; Supremo Slides p. 62)) e sulfas (\"depleção de AF no feto = teratogênica\", slide 37 da Aula 2 (Prof. Érico; Supremo Slides p. 81)). Cefalosporina de 1ª geração oral (cefalexina) é segura e cobre E. coli, Klebsiella e P. mirabilis (slide 43 da Aula 2 (Prof. Érico; Supremo Slides p. 87)). O aluno marcou A; confere.", "SUPREMO INC.                                                                                             Supremo Provas · NPC 01 · Infectologia"]}, {"n": 16, "title": "Escolha de antimicrobiano · celulite extensa", "tag": "NPC 01", "stem": "Utilize a lista abaixo e selecione o antimicrobiano mais adequado para cada situação clínica: a) Cefalexina. b) Oxacilina . c) Vancomicina. d) Meropenem. e) Penicilina Cristalina.\n16. Paciente com celulite extensa em membro inferior esquerdo, após corte local ( )", "opts": [["a", "Cefalexina."], ["b", "Oxacilina ."], ["c", "Vancomicina."], ["d", "Meropenem."], ["e", "Penicilina Cristalina."]], "ans": "b", "cm": ["Nota de transcrição: Questões 11 a 16 compartilham a lista de antimicrobianos, repetida aqui em cada uma; no original a lista aparece uma vez, antes da questão 11, e cada situação termina com \"( )\".", "Celulite extensa após trauma em paciente sem comorbidade: agentes são S. aureus (sensível) e S. pyogenes; sendo extensa, trata-se por via venosa com oxacilina, que cobre os dois. Penicilina cristalina (E) não cobre S. aureus produtor de penicilinase (erisipela seria outra história); cefalexina é oral, para casos leves. Compare com a 13, em que bacteremia em imunossuprimido justifica vancomicina. O aluno marcou E; a resposta é B."]}, {"n": 17, "title": "Leishmaniose visceral · coinfecção HIV", "tag": "NPC 01", "stem": "Paciente com diagnóstico de infecção pelo HIV + Leishmaniose Visceral. Qual é a droga mais adequada para tratamento desse paciente?", "opts": [["a", "Alopurinol."], ["b", "Anfotericina B desoxicolato."], ["c", "Anfotericina B lipossomal."], ["d", "Antimoniato pentavalente. SUPREMO INC.                                                                            Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Infecção pelo HIV (tratamento e profilaxia) é critério de indicação da anfotericina B lipossomal (slide 71 da Aula 5 (Profa. Dionne; Supremo Slides p. 423)). O antimoniato é mais tóxico e menos eficaz no coinfectado. O aluno marcou c (com interrogação); confere."]}, {"n": 18, "title": "Melioidose · fatores de risco", "tag": "NPC 01", "stem": "São fares de risco para melioidose:\nI. Diabetes\nII. Alcoolismo\nIII. Doença pulmonar crônica\nIV. Doença renal crônica\nV. Uso de drogas imunossupressoras", "opts": [["a", "I, II e III."], ["b", "I, III e IV."], ["c", "II e V."], ["d", "II, II, III, IV e V"]], "ans": "d", "cm": ["Nota de transcrição: \"fares\" (fatores) e \"II, II, III, IV e V\" (I, II, ...) como no original.", "O slide de fatores de risco lista exatamente os cinco: diabetes, alcoolismo, doença pulmonar crônica, doença renal crônica e uso de drogas imunossupressoras (slide 34 da Aula 7 (Profa. Dionne; Supremo Slides p. 521)). A alternativa d tem erro de digitação (\"II, II\") mas é a única com todos; a intenção da banca é clara. O aluno marcou d; confere."]}, {"n": 19, "title": "Influenza · indicação de oseltamivir", "tag": "Fora do cronograma", "stem": "Diogo, 53 anos, desde ontem apresenta febre alta, dor de garganta, obstrução nasal e tosse não produtiva. Nega doenças prévias. Exame físico: PA:1 20X80 mmHg, T: 37,4ºC, FR: 12 irpm P: 80 bpm. IMC: 36. Tórax e Abdome: sem alterações. Extremidades: ppp, sem edema.\nAssinale a alternativa CORRETA:", "opts": [["a", "Sintomáticos"], ["b", "Sintomáticos + Amoxicilina"], ["c", "Sintomáticos + Oseltamivir"], ["d", "Sintomáticos + Broncodilatador"]], "ans": "a", "cm": ["Nota de transcrição: \"PA:1 20X80\" como no original.", "Síndrome gripal sem sinais de gravidade (FR 12, sem dispneia). O protocolo de influenza do Ministério da Saúde indica oseltamivir para síndrome respiratória aguda grave ou para grupos de risco; obesidade entra como risco a partir de IMC ≥ 40 em adultos. Com IMC 36, 53 anos e sem comorbidades, Diogo não é grupo de risco: sintomáticos. Amoxicilina não trata vírus; broncodilatador sem broncoespasmo não se indica. Atenção: o gabarito do compilado (Gemini) marca c considerando IMC 36 risco, o que não segue o protocolo; o aluno hesitou entre c e d. Se a banca tiver usado critério de obesidade mais amplo, c seria a esperada: ponto de recurso. Fora do cronograma da NPC 01."]}, {"n": 20, "title": "Antifúngicos", "tag": "Fora do cronograma", "stem": "Assinale a alternativa CORRETA:", "opts": [["a", "Flucitosina, fluconazol, and voriconazol não apresentam boa penetração em SNC."], ["b", "Anfotericina B lipossomal, novos triazólicos e equinocandinas são drogas com boa ação na candidúria."], ["c", "O itraconazol tem boa absorção pelo TGI e é droga de escolha para as micoses profundas."], ["d", "O ytratamento de primeira linha para aspergilose invasiva é o voriconazol."]], "ans": "d", "cm": ["Nota de transcrição: \"and\" e \"ytratamento\" como no original.", "Voriconazol é a primeira linha da aspergilose invasiva. a: flucitosina, fluconazol e voriconazol penetram bem no SNC (por isso são usados em meningite criptocócica e infecções fúngicas do SNC). b: equinocandinas, anfotericina lipossomal e voriconazol/posaconazol quase não são excretados ativos na urina; para candidúria o de escolha é o fluconazol. c: a absorção do itraconazol é errática (depende de acidez e alimento) e ele não é escolha para \"as micoses profundas\" de modo geral. O aluno marcou b. Fora do cronograma da NPC 01.", "SUPREMO INC.                                                                               Supremo Provas · NPC 01 · Infectologia"]}]}, {"id": 3, "title": "Formulário sem ano                              ", "sub": "Prova em formulário online, ano não identificado", "intro": "Fonte: Provas antigas/Prova sem ano - prints de formulário com marcações.pdf (18 prints de tela, com a alternativa escolhida por um aluno); conferida com o Compilado de Benjamim Vieira, p. 14-19 (\"Prova de Infectologia\") 20 questões distintas reconstruídas de 18 prints sobrepostos. Ordem das questões reconstruída pela primeira aparição nos prints (a ordem original do formulário não é conhecida); alternativas sem letra no formulário, letradas aqui na ordem exibida. As marcações do aluno não foram usadas como gabarito. O gabarito oficial de 2025.1 (20 questões) foi comparado e não corresponde a esta ordem de questões; não foi usado.", "qs": [{"n": 1, "title": "Tuberculose · efeitos adversos", "tag": "NPC 01", "stem": "Paciente com 43 anos, sexo feminino, relata que faz tratamento para tuberculose iniciado há 45 dias e está apresentando dormência nas pernas. Acredita que tem relação com “urina avermelhada” observada também após início do tratamento. Assinale a alternativa CORRETA:", "opts": [["a", "A interrupção do tratamento está indicada até o paciente apresentar melhora dos sintomas."], ["b", "Orientar que a coloração avermelhada da urina é transitória, desaparecendo geralmente, após o segundo mês de tratamento. 2"], ["c", "Prescrever vitamina B6 (piridoxina) devido a neuropatia periférica mais comumente pelo uso da isoniazida."], ["d", "Os sintomas descritos são provavelmente pelo uso da pirazinamida e orientar que deverá desaparecer após o segundo mês quando a droga é suspensa."]], "ans": "c", "cm": ["Nota de transcrição: O \"2\" no fim da alternativa b está no formulário.", "No quadro de efeitos adversos do deck, neuropatia periférica é atribuída à isoniazida (comum) e ao etambutol (incomum), com conduta \"medicar com piridoxina (vitamina B6) na dosagem de 50 mg/dia\"; urina avermelhada é da rifampicina, conduta \"orientar\" (slide 99 da Aula 3 (Profa. Dionne; Supremo Slides p. 204); mudança de cor da urina também em slide 97 da Aula 3 (Profa. Dionne; Supremo Slides p. 202)). A b erra porque a rifampicina segue na manutenção (RH por 4 meses): a cor persiste o tratamento todo. A d culpa a droga errada. A a é desnecessária: efeito menor não suspende o esquema. Marcação no print: c; confere."]}, {"n": 2, "title": "Enterococo resistente à penicilina", "tag": "NPC 01", "stem": "Qual antibiótico está indicado para infecções por Enterococos Pen-R (penicilino-resistente)?", "opts": [["a", "Oxacilina"], ["b", "Ceftriaxona"], ["c", "Vancomicina"]], "ans": "c", "cm": ["Nota de transcrição: O print termina na terceira alternativa: pode haver uma quarta, não capturada [lacuna de print]. O espectro dos glicopeptídeos inclui enterococos (slide 55 da Aula 2 (Prof. Érico; Supremo Slides p. 99)). Enterococo é intrinsecamente resistente a todas as cefalosporinas (ceftriaxona nunca serve) e a oxacilina não tem ação útil sobre ele; se resistente à penicilina/ampicilina, a opção é vancomicina. Marcação no print: vancomicina; confere."]}, {"n": 3, "title": "Leptospirose · forma pulmonar grave", "tag": "NPC 01", "stem": "Paciente com 23 anos, sexo masculino, admitido com história de um dia de febre, cefaleia intensa, mialgia e vômitos. Mora em região metropolitana e relata presença frequente de roedores. Relata que 1 semana antes de adoecer esteve em área de enchente. Evoluiu com persistência da febre e mialgia intensa. No terceiro dia de internamento apresentou dispneia, ictericia, oligúria e foi internado em UTI. Um pouco antes da transferência tinha apresentado hemorragia pulmonar maciça e foi entubado com dificuldade. Qual hipótese diagnóstica mais provável para esse caso clínico?", "opts": [["a", "Forma pulmonar da leptospirose"], ["b", "Dengue Grave"], ["c", "Febre Amarela"], ["d", "Melioidose SUPREMO INC.                                                                  Supremo Provas · NPC 01 · Infectologia"]], "ans": "a", "cm": ["Exposição a enchente e roedores com incubação compatível, mialgia intensa e evolução com icterícia, oligúria e hemorragia pulmonar maciça: forma pulmonar grave da leptospirose (slide 34 da Aula 6 (Profa. Dionne; Supremo Slides p. 467)), associada à forma ictérica com IRA (slides 29 e 31 da Aula 6 (Profa. Dionne; Supremo Slides p. 462 e 464)). Dengue grave não dá icterícia com IRA oligúrica nesse padrão; febre amarela não tem a exposição; melioidose dá pneumonia/sepse por exposição a solo e água, sem a tríade de Weil. Marcação: a; confere."]}, {"n": 4, "title": "Gonorreia · tratamento", "tag": "NPC 01", "stem": "Qual o antimicrobiano mais indicado para tratamento de gonorréia?", "opts": [["a", "Ciprofloxacina"], ["b", "Gentamicina"], ["c", "Ceftriaxona"], ["d", "Azitromicina"]], "ans": "c", "cm": ["Ceftriaxona IM em dose única é o tratamento de escolha da gonorreia no PCDT de IST do Ministério da Saúde. Ciprofloxacina foi abandonada pela alta resistência do gonococo às quinolonas; azitromicina isolada não é recomendada (entra associada, para clamídia); gentamicina é alternativa de exceção. O deck lista a ceftriaxona entre as cefalosporinas de 3ª geração (slide 44 da Aula 2 (Prof. Érico; Supremo Slides p. 88)) mas não trata de IST: tema de conhecimento geral. Marcação: ceftriaxona; confere."]}, {"n": 5, "title": "Celulite com anafilaxia à amoxicilina", "tag": "NPC 01", "stem": "Paciente do sexo feminino, 44 anos, atendida com celulite no membro superior esquerdo, cinco dias após aplicação de medicação intramuscular. O médico que a atendeu solicitou internamento e início de medicação antimicrobiana endovenosa. Qual seria, dentre as opções abaixo, o antimicrobiano mais indicado para início de tratamento empírico caso a mesma relatasse história prévia de reação anafilática após uso de amoxicilina no passado?", "opts": [["a", "Cefalexina"], ["b", "Ciprofloxacina"], ["c", "Oxacilina"], ["d", "Vancomicina"]], "ans": "d", "cm": ["Celulite (estafilococo e estreptococo) com anafilaxia à amoxicilina. Oxacilina é penicilina: proibida. A cefalexina tem reatividade cruzada global baixa (cerca de 2%), mas o deck destaca que cefalexina e cefadroxila têm cadeia lateral R1 semelhante à da amoxicilina (slides 48 e 49 da Aula 2 (Prof. Érico; Supremo Slides p. 92 e 93)): é justamente a cefalosporina a evitar após anafilaxia à amoxicilina, e além disso é oral. Ciprofloxacina tem cobertura ruim de estreptococo e estafilococo de pele (no deck, atividade limitada em Gram-positivos, slide 21 da Aula 2 (Prof. Érico; Supremo Slides p. 65)). Vancomicina venosa cobre os dois agentes sem risco de reação cruzada. Marcação no print: ciprofloxacina (em dois prints); a resposta é d.", "SUPREMO INC.                                                                                    Supremo Provas · NPC 01 · Infectologia"]}, {"n": 6, "title": "Dengue · sinais de alarme", "tag": "NPC 01", "stem": "Paciente do sexo feminino, 45 anos, compareceu a UBS referindo febre não aferida, cefaleia, dor retroorbitária, mialgia e artralgia há 48 horas. Foi prescrito dipirona, com melhora parcial dos sintomas. No 5º dia de doença, procurou a UPA, por persistirem os sintomas e pelo aparecimento de vômitos persistentes e dor abdominal intensa. Ao exame: estado geral regular, normocorada, desidratada, anictérica. T 38ºC, PA: 100x60 mmHg; FC: 94bpm. Pele: exantema maculopapular difuso. Abdome: globoso, normotenso, levemente doloroso, sem visceromegalias. Prova do laço positiva. Hemograma: Hb: 14g/dL; Ht: 48%; Plaquetas: 87.000/ mm3; Leucócitos totais: 3.200/mm3.Considerando o diagnóstico de Dengue, classifique e identifique a conduta mais correta para o paciente do caso acima.", "opts": [["a", "Classificação de risco B, e deve ser submetido a hidratação oral vigorosa e mantido em observação."], ["b", "Classificação de risco B, e deve ser submetido a hidratação via endovenosa e mantido em observação."], ["c", "Classificação de risco C, e deve ser submetido a hidratação via endovenosa imediata."], ["d", "Classificação de risco D, e deve ser submetido a hidratação via endovenosa imediata."]], "ans": "c", "cm": ["Vômitos persistentes e dor abdominal intensa são sinais de alarme (slide 30 da Aula 4 (Profa. Dionne; Supremo Slides p. 259)), e o Ht de 48% sugere hemoconcentração: grupo C, internação com hidratação venosa imediata (slides 62 e 63 da Aula 4 (Profa. Dionne; Supremo Slides p. 291 e 292)). A prova do laço positiva levaria só ao B se não houvesse alarme (a, b). Não há choque (PA 100x60 sem convergência, FC 94, sem má perfusão descrita), sangramento grave ou disfunção de órgão para D (slide 67 da Aula 4 (Profa. Dionne; Supremo Slides p. 296)). Marcação: c; confere."]}, {"n": 7, "title": "Pielonefrite complicada · terapia empírica", "tag": "NPC 01", "stem": "Paciente com 55 anos, diabético, com nefrolitíase complicada com quadro de infecção urinária. Ao exame: PA: 90 X 50 mmHg P: 119 ppm. Febril, taquipneico, acianótico, normocorado, orientado, com fáscies de dor. Presença de Giordano + a direita.Dentre os antimicrobianos abaixo, qual estaria mais indicado nesse caso para início de tratamento empírico?", "opts": [["a", "Cefalotina"], ["b", "Amicacina"], ["c", "Ciprofloxacina"], ["d", "Sulfametoxazol + Trimetoprima SUPREMO INC.                                                                  Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Nota de transcrição: O print traz \"Cefalotina\"; o compilado transcreveu \"Cefalexina\".", "Pielonefrite complicada, com repercussão hemodinâmica, por Gram-negativo entérico provável. Nas tabelas do Prof. Érico, a ciprofloxacina (VO e EV) tem boa atividade em enterobactérias e tem a ITU como indicação (slides 21 e 25 da Aula 2 (Prof. Érico; Supremo Slides p. 65 e 69)). Cefalotina (1ª geração) tem cobertura limitada de Gram-negativos para esse cenário (slide 43 da Aula 2 (Prof. Érico; Supremo Slides p. 87)); SMX-TMP tem resistência alta em E. coli e não é escolha empírica em quadro grave. A amicacina cobre Gram-negativos, mas em diabético hipotenso (risco de lesão renal) a nefrotoxicidade pesa, e o deck não a trabalha. Na prática atual, com instabilidade, muitos serviços usariam ceftriaxona ou um carbapenêmico, ausentes das opções. Marcação: c; confere."]}, {"n": 8, "title": "Melioidose grave · tratamento", "tag": "NPC 01", "stem": "Qual o antibiótico é o mais indicado para tratamento da melioidose grave?", "opts": [["a", "Ciprofloxacina"], ["b", "Meropenem"], ["c", "Vancomicina"], ["d", "Piperacilina + Tazobactam"]], "ans": "b", "cm": ["Fase intensiva: ceftazidima na melioidose não complicada e meropenem para paciente em UTI, bacteremia persistente ou neuromelioidose (slide 51 da Aula 7 (Profa. Dionne; Supremo Slides p. 538)); falência de órgão ou não resposta à ceftazidima também indicam meropenem (slide 52 da Aula 7 (Profa. Dionne; Supremo Slides p. 539)). Vancomicina não cobre Gram-negativo; ciprofloxacina e piperacilina-tazobactam não são recomendadas. Marcação: meropenem; confere."]}, {"n": 9, "title": "Tuberculose · esquema básico", "tag": "NPC 01", "stem": "Paciente com 25 anos de idade e 66 kg com TRM (Genexpert) detectável e sensível a rifampicina no escarro e em fragmento de linfonodo cervical, obtido por biópsia, o esquema de tratamento deve ser:", "opts": [["a", "Rifampicina, Isoniazida, Pirazinamida por 2 meses seguido por Rifampicina, Isoniazida por 4 meses."], ["b", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 10 meses."], ["c", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 6 meses."], ["d", "Rifampicina, Isoniazida, Pirazinamida e Etambutol por 2 meses seguido por Rifampicina, Isoniazida por 4 meses."]], "ans": "d", "cm": ["Nota de transcrição: O compilado transcreve a alternativa c como \"por 7 meses\"; o print mostra \"por 6 meses\". Mesma questão da 2023.2 (questão 1), com 25 anos. Pulmonar + ganglionar: 2RHZE/4RH (slides 93 e 94 da Aula 3 (Profa. Dionne; Supremo Slides p. 198 e 199)); 10 meses de manutenção só nas formas meníngea e óssea (slide 95 da Aula 3 (Profa. Dionne; Supremo Slides p. 200)). Marcação: d; confere."]}, {"n": 10, "title": "Leishmaniose visceral · diagnóstico", "tag": "NPC 01", "stem": "Paciente FECF, 26 anos, foi internado no Hospital Geral Dr, César Cals com história de há 4 meses apresenta febre diária e emagrecimento. Nas últimas 2 semanas relata gengivorragia e epistaxe. O exame fisico evidenciou palidez cutânea (3+/4), hepatoesplenomegalia. O hemograma mostrou pancitopenia e a eletroforese de proteínas evidenciou hipoalbuminemia com hipergamaglobulinemia, com caracteristicas de gamopatia policlonal. Qual exame é mais indicado para confirmar principal hipótese diagnóstica para esse caso?", "opts": [["a", "ELISA."], ["b", "Hemocultura seriada, preferencialmente por método automatizad"], ["c", "Imunoflourescência Indireta."], ["d", "rK39"]], "ans": "d", "cm": ["Nota de transcrição: \"automatizad\" (cortado) e \"Imunoflourescência\" como no formulário.", "Mesmo raciocínio das questões de Pedro (2023.2, 8) e Márcio (2026.1, 13): o teste rápido rK39 é o indicado para febre com esplenomegalia em área endêmica e, positivo, define o diagnóstico (slides 52 e 54 da Aula 5 (Profa. Dionne; Supremo Slides p. 404 e 406)). Marcação: rK39; confere."]}, {"n": 11, "title": "Leishmaniose visceral · tratamento", "tag": "NPC 01", "stem": "Qual é a droga mais adequada para tratamento desse paciente?", "opts": [["a", "Anfotericina B desoxicolato."], ["b", "Anfotericina B lipossomal."], ["c", "Antimoniato pentavalente."], ["d", "Alopurinol. SUPREMO INC.                                                                   Supremo Provas · NPC 01 · Infectologia"]], "ans": "c", "cm": ["Refere-se a FECF (questão 10): 26 anos, sem disfunção orgânica, HIV, imunossupressão ou gestação descritos. Nenhum critério de anfotericina lipossomal do deck (slides 70 e 71 da Aula 5 (Profa. Dionne; Supremo Slides p. 422 e 423)); a gengivorragia e a epistaxe somam pouco no escore clínico de gravidade (um ponto por sangramento em 1 a 2 sítios), longe do corte de 4. Primeira escolha: antimoniato (slide 64 da Aula 5 (Profa. Dionne; Supremo Slides p. 416)). Marcação: antimoniato; confere.", "SUPREMO INC.                                                                          Supremo Provas · NPC 01 · Infectologia"]}, {"n": 12, "title": "Leptospirose · diagnóstico e tratamento", "tag": "NPC 01", "stem": "Paciente GSA, masculino, 23 anos, casado, relata que há seia dias, após dia de trabalho, apresenta mialgia em membros inferiores. Há 03 dias, evoluiu com febre (T.39ºC), cefaleia, náuseas e dor abdominal. Refere contato frquente com água de chuva e ratos, mesmo fazendo uso de equipamentos de proteção individual (EPI)Exame físico: EGR, consciente, orientado, ictérico, acianótico, com fácies de dor. PA: 130 X 80 mmHg; FC: 115 bpm; FR: 22 inc/min; Temp: 38,9 ºC; Sat O2: 91% em ar ambiente. AR: MV + simétrico com crepitações nas bases pulmonaresões. AC: RCR em 2T, BCNF, taquicárdico s/ sopros. ABD: RHA presentes, plano, doloroso difusamente à palpação superficial, sem visceromegalias. Extremidades: dor à palpação das panturrilhas. Assinale a melhor opção em relação ao diagnóstico e à opção terapêutica.", "opts": [["a", "Choque Sép
